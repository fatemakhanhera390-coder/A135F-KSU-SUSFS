name: A135F KernelSU-Next SUSFS MAX ARAF

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 4.19.325-MAX-ARAF
    runs-on: ubuntu-latest

    env:
      KERNEL_SOURCE: https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_exynos850.git
      KERNEL_BRANCH: lineage-24.0
      DEFCONFIG: exynos850-a13nsxx_defconfig

    steps:

      # ==========================================
      # 1. Free disk space
      # ==========================================
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      # ==========================================
      # 2. Checkout workflow repository
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip zip bc \
            bison flex build-essential \
            cpio rsync python3 \
            libssl-dev libelf-dev \
            device-tree-compiler \
            lz4

      # ==========================================
      # 4. Add swap
      # ==========================================
      - name: Add swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # ==========================================
      # 5. Setup Android Clang
      # ==========================================
      - name: Setup Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$GITHUB_WORKSPACE/clang"
          mkdir -p "$TOOLCHAIN"

          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz"

          echo "Downloading Android Clang r450784e..."

          curl -fL \
            --retry 8 \
            --retry-delay 10 \
            --connect-timeout 30 \
            "$URL" \
            -o "$GITHUB_WORKSPACE/clang.tar.gz"

          echo "Extracting Clang..."
          tar -xzf "$GITHUB_WORKSPACE/clang.tar.gz" -C "$TOOLCHAIN"

          echo "Checking Clang..."

          test -x "$TOOLCHAIN/bin/clang"
          test -x "$TOOLCHAIN/bin/ld.lld"

          echo "Clang found:"
          "$TOOLCHAIN/bin/clang" --version

          echo "LLD found:"
          "$TOOLCHAIN/bin/ld.lld" --version

          # Current step PATH
          export PATH="$TOOLCHAIN/bin:$PATH"

          # Future steps PATH
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          # Also persist LLVM variables
          echo "LLVM=$TOOLCHAIN/bin/" >> "$GITHUB_ENV"
          echo "PATH=$TOOLCHAIN/bin:$PATH" >> "$GITHUB_ENV"

          echo "================================="
          echo "CLANG READY"
          echo "================================="

      # ==========================================
      # 6. Verify toolchain
      # ==========================================
      - name: Verify toolchain
        run: |
          set -eux

          which clang
          which ld.lld

          clang --version
          ld.lld --version

      # ==========================================
      # 7. Clone A135F kernel
      # ==========================================
      - name: Fetch A135F kernel
        run: |
          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_SOURCE" \
            kernel

          cd kernel

          echo "Kernel commit:"
          git log -1 --oneline

          echo "Kernel version:"
          make kernelversion

      # ==========================================
      # 8. Install KernelSU-Next dev-susfs
      # ==========================================
      - name: Install KernelSU-Next dev-susfs
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" \
            | bash -s dev-susfs

          test -d drivers/kernelsu

          echo "KernelSU-Next installed."
          ls -la drivers/kernelsu | head

      # ==========================================
      # 9. Apply manual syscall hooks
      # ==========================================
      - name: Apply KernelSU manual hooks
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          curl -LSs \
            "https://raw.githubusercontent.com/Iam-nishan/Jujutsu-kernel/V6/syscall_hook.sh" \
            -o syscall_hook.sh

          chmod +x syscall_hook.sh

          bash syscall_hook.sh

      # ==========================================
      # 10. Verify SUSFS integration
      # ==========================================
      - name: Verify SUSFS integration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "Checking KernelSU Kconfig..."

          grep -R "config KSU" drivers/kernelsu/Kconfig | head -20 || true

          echo "Checking SUSFS..."

          grep -R "KSU_SUSFS" drivers/kernelsu/Kconfig | head -30 || true

          if ! grep -q "KSU_SUSFS" drivers/kernelsu/Kconfig; then
            echo "ERROR: KernelSU-Next SUSFS integration missing!"
            exit 1
          fi

          echo "SUSFS integration detected."

      # ==========================================
      # 11. Configure kernel
      # ==========================================
      - name: Configure A135F kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

          ./scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_MANUAL_HOOK \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            --enable CONFIG_KSU_SUSFS_SUS_MAP \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --enable CONFIG_OVERLAY_FS \
            --disable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_WERROR

          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-MAX-ARAF"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "=============================="
          echo "KERNELSU CONFIG"
          echo "=============================="

          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_SUSFS=' \
            out/.config

          echo "=============================="
          echo "LOCALVERSION"
          echo "=============================="

          grep CONFIG_LOCALVERSION out/.config

      # ==========================================
      # 12. Build kernel
      # ==========================================
      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            KCFLAGS="-Wno-error=strict-prototypes" \
            -j"$(nproc)"

      # ==========================================
      # 13. Verify Image.gz
      # ==========================================
      - name: Verify kernel image
        run: |
          set -eux

          cd kernel

          ls -lh out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image.gz

          file out/arch/arm64/boot/Image.gz

      # ==========================================
      # 14. Prepare AnyKernel3
      # ==========================================
      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          cp kernel/out/arch/arm64/boot/Image.gz \
            AnyKernel3/

      # ==========================================
      # 15. Configure AnyKernel3
      # ==========================================
      - name: Configure AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cd AnyKernel3

          sed -i \
            's/^kernel.string=.*/kernel.string=A135F KernelSU-Next SUSFS MAX ARAF/' \
            anykernel.sh

          sed -i \
            's/^device.name1=.*/device.name1=SM-A135F/' \
            anykernel.sh

          sed -i \
            's/^device.name2=.*/device.name2=SM-A135F\/DS/' \
            anykernel.sh

          echo "AnyKernel3 configured."

          grep -E \
            'kernel.string|device.name' \
            anykernel.sh || true

      # ==========================================
      # 16. Package
      # ==========================================
      - name: Package AnyKernel3
        run: |
          set -eux

          cd AnyKernel3

          rm -rf .git .github README.md

          zip -r9 \
            ../A135F-4.19.325-MAX-ARAF-KSUN-SUSFS.zip \
            . \
            -x "*.git*"

      # ==========================================
      # 17. Copy raw kernel
      # ==========================================
      - name: Copy raw kernel
        run: |
          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            A135F-4.19.325-MAX-ARAF-Image.gz

      # ==========================================
      # 18. Upload AnyKernel3
      # ==========================================
      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: A135F-4.19.325-MAX-ARAF-KSUN-SUSFS
          path: A135F-4.19.325-MAX-ARAF-KSUN-SUSFS.zip
          retention-days: 7

      # ==========================================
      # 19. Upload Image.gz
      # ==========================================
      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: A135F-4.19.325-MAX-ARAF-Image
          path: A135F-4.19.325-MAX-ARAF-Image.gz
          retention-days: 7

      # ==========================================
      # 20. Build summary
      # ==========================================
      - name: Build summary
        run: |
          echo "========================================="
          echo " A135F KernelSU-Next + SUSFS"
          echo " MAX ARAF BUILD"
          echo "========================================="
          echo ""
          echo "Kernel: 4.19.325"
          echo "Device: SM-A135F/DS"
          echo "KSU: KernelSU-Next"
          echo "SUSFS: enabled"
          echo ""
          echo "BUILD SUCCESSFUL"
