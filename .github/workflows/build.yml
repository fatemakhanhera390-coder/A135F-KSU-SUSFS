name: A135F KernelSU-Next SUSFS MAX ARAF

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 4.19.325-MAX-ARAF
    runs-on: ubuntu-latest

    env:
      KERNEL_SOURCE: https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git
      KERNEL_BRANCH: lineage-24.0
      DEFCONFIG: exynos850-a13nsxx_defconfig

    steps:

      # ============================================================
      # 1. Free disk space
      # ============================================================

      - name: Free disk space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

          df -h


      # ============================================================
      # 2. Checkout workflow repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 3. Install dependencies
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            xz-utils \
            bzip2 \
            build-essential \
            bc \
            bison \
            flex \
            cpio \
            rsync \
            python3 \
            python3-pip \
            device-tree-compiler \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            libxml2-utils \
            lz4 \
            lzop \
            zstd \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            clang \
            lld

          git --version
          gcc --version
          aarch64-linux-gnu-gcc --version


      # ============================================================
      # 4. Setup Android Clang r450784e
      # ============================================================

      - name: Setup Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$GITHUB_WORKSPACE/android-clang"

          rm -rf "$TOOLCHAIN"
          mkdir -p "$TOOLCHAIN"

          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz"

          echo "Downloading Android Clang r450784e..."

          curl -fL \
            --retry 10 \
            --retry-delay 8 \
            --connect-timeout 30 \
            "$URL" \
            -o "$GITHUB_WORKSPACE/clang.tar.gz"

          test -s "$GITHUB_WORKSPACE/clang.tar.gz"

          echo "Extracting..."

          tar -xzf "$GITHUB_WORKSPACE/clang.tar.gz" \
            -C "$TOOLCHAIN"

          echo "Checking toolchain..."

          test -x "$TOOLCHAIN/bin/clang"
          test -x "$TOOLCHAIN/bin/clang++"
          test -x "$TOOLCHAIN/bin/ld.lld"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          echo "ANDROID_CLANG=$TOOLCHAIN/bin" >> "$GITHUB_ENV"

          "$TOOLCHAIN/bin/clang" --version
          "$TOOLCHAIN/bin/ld.lld" --version


      # ============================================================
      # 5. Verify toolchain
      # ============================================================

      - name: Verify toolchain
        shell: bash
        run: |
          set -eux

          which clang
          which ld.lld

          clang --version
          ld.lld --version

          test -x "$ANDROID_CLANG/clang"
          test -x "$ANDROID_CLANG/ld.lld"


      # ============================================================
      # 6. Fetch A135F kernel
      # ============================================================

      - name: Fetch A135F kernel
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_SOURCE" \
            kernel

          cd kernel

          echo "Kernel commit:"
          git log -1 --oneline

          echo "Kernel version:"
          make kernelversion

          test "$(make kernelversion)" = "4.19.325"

          echo "Defconfig:"
          test -f "arch/arm64/configs/$DEFCONFIG"

          echo "Kernel source verified."


      # ============================================================
      # 7. Install KernelSU-Next SUSFS 4.19 branch
      # ============================================================

      - name: Install KernelSU-Next SUSFS 4.19
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "Installing KernelSU-Next next-susfs-4.19..."

          git clone \
            --depth=1 \
            --branch next-susfs-4.19 \
            https://github.com/SuleMareVientu/KernelSU-Next.git \
            KernelSU-Next

          test -d KernelSU-Next/kernel

          cd KernelSU-Next

          git log -1 --oneline

          cd ..

          ln -sfn \
            "$(pwd)/KernelSU-Next/kernel" \
            drivers/kernelsu

          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          test -L drivers/kernelsu

          echo "KernelSU-Next SUSFS tree installed."

          grep -R \
            "CONFIG_KSU_SUSFS" \
            drivers/kernelsu \
            | head -20 || true


      # ============================================================
      # 8. Prepare output directory
      # ============================================================

      - name: Prepare build directory
        shell: bash
        run: |
          set -eux

          cd kernel

          rm -rf out
          mkdir -p out

          echo "Build directory ready."


      # ============================================================
      # 9. Configure A135F kernel
      # ============================================================

      - name: Configure A135F kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_OVERLAY_FS \
            --disable CONFIG_LTO \
            --disable CONFIG_LTO_CLANG \
            --disable CONFIG_THINLTO \
            --disable CONFIG_WERROR \
            --set-str CONFIG_LOCALVERSION "-MAX-ARAF"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "========== KSU CONFIG =========="

          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KPROBES=|CONFIG_KPROBE_EVENTS=|CONFIG_OVERLAY_FS=|CONFIG_LOCALVERSION=' \
            out/.config \
            || true

          echo
          echo "========== SUSFS CONFIG =========="

          grep 'CONFIG_KSU_SUSFS_' \
            out/.config \
            | head -80 \
            || true


      # ============================================================
      # 10. Verify KernelSU/SUSFS source
      # ============================================================

      - name: Verify KernelSU SUSFS integration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          test -d drivers/kernelsu

          echo "KernelSU source:"
          ls drivers/kernelsu

          echo
          echo "Searching SUSFS..."

          grep -R \
            "SUSFS" \
            drivers/kernelsu \
            | head -30 \
            || true

          echo
          echo "Searching KSU..."

          grep -R \
            "CONFIG_KSU" \
            drivers/kernelsu/Kconfig \
            | head -30 \
            || true


      # ============================================================
      # 11. Build kernel
      # ============================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="$ANDROID_CLANG:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CC="$ANDROID_CLANG/clang"
          export LD="$ANDROID_CLANG/ld.lld"

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export KBUILD_BUILD_USER="MAX-ARAF"
          export KBUILD_BUILD_HOST="MAX-ARAF-GITHUB"

          echo "Compiler:"
          "$CC" --version

          echo
          echo "Starting kernel build..."

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="$CC" \
            LD="$LD" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            KCFLAGS="-Wno-error=strict-prototypes"


      # ============================================================
      # 12. Verify kernel image
      # ============================================================

      - name: Verify kernel image
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "Searching kernel image..."

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=Image.gz-dtb" >> "$GITHUB_ENV"
            echo "Found Image.gz-dtb"

          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "KERNEL_IMAGE=Image.gz" >> "$GITHUB_ENV"
            echo "Found Image.gz"

          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=Image" >> "$GITHUB_ENV"
            echo "Found Image"

          else
            echo "ERROR: No kernel image found."
            exit 1
          fi

          ls -lh out/arch/arm64/boot/


      # ============================================================
      # 13. Verify kernel strings
      # ============================================================

      - name: Verify KSU SUSFS in kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "Checking kernel for KernelSU..."

          strings "out/arch/arm64/boot/$KERNEL_IMAGE" \
            | grep -i "KernelSU" \
            | head -20 \
            || true

          echo
          echo "Checking kernel for SUSFS..."

          strings "out/arch/arm64/boot/$KERNEL_IMAGE" \
            | grep -i "susfs" \
            | head -30 \
            || true


      # ============================================================
      # 14. Prepare AnyKernel3
      # ============================================================

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf AnyKernel3/.git

          cp \
            "kernel/out/arch/arm64/boot/$KERNEL_IMAGE" \
            AnyKernel3/

          echo "Copied kernel:"
          ls -lh AnyKernel3/"$KERNEL_IMAGE"


      # ============================================================
      # 15. Configure AnyKernel3
      # ============================================================

      - name: Configure AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cd AnyKernel3

          sed -i \
            's/^kernel.string=.*/kernel.string=4.19.325-MAX-ARAF-KernelSU-Next-SUSFS/' \
            anykernel.sh

          sed -i \
            's/^do.devicecheck=.*/do.devicecheck=0/' \
            anykernel.sh

          sed -i \
            's/^is_slot_device=.*/is_slot_device=0/' \
            anykernel.sh

          echo
          echo "AnyKernel3 configuration:"
          grep -E \
            'kernel.string|do.devicecheck|is_slot_device' \
            anykernel.sh \
            || true


      # ============================================================
      # 16. Package AnyKernel3
      # ============================================================

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cd AnyKernel3

          zip -r9 \
            ../A135F-KSU-Next-SUSFS-MAX-ARAF.zip \
            . \
            -x '*.git*' \
            -x '*README.md'

          cd ..

          ls -lh \
            A135F-KSU-Next-SUSFS-MAX-ARAF.zip


      # ============================================================
      # 17. Copy raw kernel
      # ============================================================

      - name: Copy raw kernel
        shell: bash
        run: |
          set -eux

          cp \
            "kernel/out/arch/arm64/boot/$KERNEL_IMAGE" \
            "A135F-$KERNEL_IMAGE-MAX-ARAF"

          ls -lh \
            "A135F-$KERNEL_IMAGE-MAX-ARAF"


      # ============================================================
      # 18. Upload AnyKernel3
      # ============================================================

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: A135F-KSU-Next-SUSFS-MAX-ARAF
          path: A135F-KSU-Next-SUSFS-MAX-ARAF.zip
          if-no-files-found: error


      # ============================================================
      # 19. Upload raw kernel
      # ============================================================

      - name: Upload raw kernel
        uses: actions/upload-artifact@v4
        with:
          name: A135F-Raw-Kernel-MAX-ARAF
          path: A135F-*-MAX-ARAF
          if-no-files-found: error


      # ============================================================
      # 20. Build summary
      # ============================================================

      - name: Build summary
        shell: bash
        run: |
          echo "=============================================="
          echo " A135F MAX ARAF KERNEL BUILD"
          echo "=============================================="
          echo
          echo "Kernel       : 4.19.325"
          echo "Device       : Samsung Galaxy A13 SM-A135F"
          echo "Branch       : lineage-24.0"
          echo "Root         : KernelSU-Next"
          echo "SUSFS        : next-susfs-4.19"
          echo "Branding     : MAX-ARAF"
          echo
          echo "Build completed successfully."
          echo "=============================================="
