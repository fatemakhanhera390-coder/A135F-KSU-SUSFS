name: A135F KernelSU-Next SUSFS MAX ARAF

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a135f-ksun-susfs
  cancel-in-progress: true

jobs:
  build:
    name: Build 4.19.325-MAX-ARAF
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      KERNEL_SOURCE: https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git
      KERNEL_BRANCH: lineage-24.0
      KERNEL_CONFIG: exynos850-a13nsxx_defconfig

      KSU_REPO: https://github.com/pershoot/KernelSU-Next.git
      KSU_BRANCH: dev-susfs

      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: kernel-4.19

      KERNEL_LOCALVERSION: -MAX-ARAF

    steps:

      # =========================================================
      # 1. Checkout our repository
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Free runner storage
      # =========================================================

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false


      # =========================================================
      # 3. Install dependencies
      # =========================================================

      - name: Install dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            make \
            python3 \
            rsync \
            unzip \
            zip \
            zstd


      # =========================================================
      # 4. Add swap
      # =========================================================

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          free -h


      # =========================================================
      # 5. Download Android Clang
      # =========================================================
        
        
        
        
        
        
        
        
        
      - name: Setup Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$GITHUB_WORKSPACE/clang"
          mkdir -p "$TOOLCHAIN"

          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz"

          echo "Downloading Android Clang..."
          curl -fL --retry 5 --retry-delay 10 \
            "$URL" \
            -o "$GITHUB_WORKSPACE/clang.tar.gz"

          echo "Extracting..."
          tar -xzf "$GITHUB_WORKSPACE/clang.tar.gz" -C "$TOOLCHAIN"

          echo "Searching for clang..."
          CLANG_BIN="$(find "$TOOLCHAIN" -type f -name clang -executable -print -quit)"

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: clang executable not found!"
            find "$TOOLCHAIN" -maxdepth 4 -type f | head -100
            exit 1
          fi

          CLANG_DIR="$(dirname "$CLANG_BIN")"

          echo "Found clang: $CLANG_BIN"
          echo "$CLANG_DIR" >> "$GITHUB_PATH"

          "$CLANG_BIN" --version    
 
      


      # =========================================================
      # 6. Clone A135F kernel source
      # =========================================================

      - name: Fetch A135F kernel
        run: |
          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_SOURCE" \
            kernel

          cd kernel

          echo "Kernel source:"
          git log -1 --oneline

          echo "Kernel version:"
          make kernelversion


      # =========================================================
      # 7. Install KernelSU-Next SUSFS tree
      # =========================================================

      - name: Install KernelSU-Next dev-susfs
        working-directory: kernel
        run: |
          set -e

          echo "Installing KernelSU-Next:"
          echo "$KSU_REPO"
          echo "Branch:"
          echo "$KSU_BRANCH"

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" \
            | bash -s dev-susfs

          echo ""
          echo "KernelSU directory:"
          ls -la drivers/kernelsu

          echo ""
          echo "KernelSU Kconfig:"
          grep -n "config KSU" drivers/kernelsu/Kconfig | head


      # =========================================================
      # 8. Apply manual hooks for 4.19
      # =========================================================

      - name: Apply KernelSU manual hooks
        working-directory: kernel
        run: |
          set -e

          curl -LSs \
            "https://raw.githubusercontent.com/Iam-nishan/Jujutsu-kernel/V6/syscall_hook.sh" \
            -o syscall_hook.sh

          chmod +x syscall_hook.sh

          echo "Applying manual hooks..."

          bash syscall_hook.sh

          echo ""
          echo "Checking manual hooks..."

          grep -R \
            "ksu_handle_execveat" \
            fs/exec.c \
            drivers/kernelsu \
            >/dev/null

          echo "Manual hooks detected."


      # =========================================================
      # 9. Verify SUSFS is integrated in KSU tree
      # =========================================================

      - name: Verify SUSFS integration
        working-directory: kernel
        run: |
          set -e

          echo "Checking KernelSU SUSFS support..."

          if grep -R \
            "CONFIG_KSU_SUSFS" \
            drivers/kernelsu/Kconfig \
            >/dev/null 2>&1; then

            echo "CONFIG_KSU_SUSFS found."

          else

            echo "ERROR: KernelSU-Next SUSFS support was not found."
            echo "Stopping before compilation."
            exit 1

          fi

          echo ""
          echo "SUSFS configuration options:"

          grep -n \
            "KSU_SUSFS" \
            drivers/kernelsu/Kconfig \
            | head -40


      # =========================================================
      # 10. Configure kernel
      # =========================================================

      - name: Configure A135F kernel
        working-directory: kernel
        run: |
          set -e

          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$KERNEL_CONFIG"

          # -----------------------------------------------------
          # KernelSU
          # -----------------------------------------------------

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_MANUAL_HOOK


          # -----------------------------------------------------
          # SUSFS
          # -----------------------------------------------------

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_PATH

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT

          ./scripts/config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT

          ./scripts/config \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT

          ./scripts/config \
            --enable CONFIG_KSU_SUSFS_SUS_MAP

          ./scripts/config \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG


          # -----------------------------------------------------
          # KernelSU support
          # -----------------------------------------------------

          ./scripts/config \
            --enable CONFIG_OVERLAY_FS


          # -----------------------------------------------------
          # Disable LTO
          # -----------------------------------------------------

          ./scripts/config \
            --disable CONFIG_LTO_CLANG


          # -----------------------------------------------------
          # Disable warnings as errors
          # -----------------------------------------------------

          ./scripts/config \
            --disable CONFIG_WERROR


          # -----------------------------------------------------
          # MAX ARAF kernel name
          # -----------------------------------------------------

          ./scripts/config \
            --set-str CONFIG_LOCALVERSION "$KERNEL_LOCALVERSION"


          # -----------------------------------------------------
          # Finalize config
          # -----------------------------------------------------

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig


          echo ""
          echo "===== FINAL KERNEL CONFIG ====="

          grep -E \
            "CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_SUS_PATH=|CONFIG_KSU_SUSFS_SUS_MOUNT=|CONFIG_KSU_SUSFS_SUS_KSTAT=|CONFIG_KSU_SUSFS_OPEN_REDIRECT=|CONFIG_KSU_SUSFS_SUS_MAP=|CONFIG_LOCALVERSION=" \
            out/.config


      # =========================================================
      # 11. Build kernel
      # =========================================================

      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          echo "Compiler:"
          clang --version

          echo ""
          echo "Building:"
          echo "4.19.325-MAX-ARAF"

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error=strict-prototypes \
            -j"$(nproc)"


      # =========================================================
      # 12. Verify kernel image
      # =========================================================

      - name: Verify kernel image
        working-directory: kernel
        run: |
          set -e

          echo "Searching kernel image..."

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            -printf "%f %s bytes\n"

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz found."
          else
            echo "ERROR: Image.gz not found."
            exit 1
          fi

          echo ""
          echo "Kernel release:"

          make \
            O=out \
            ARCH=arm64 \
            kernelrelease


      # =========================================================
      # 13. Clone AnyKernel3
      # =========================================================

      - name: Prepare AnyKernel3
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            AnyKernel3/Image.gz


      # =========================================================
      # 14. Configure AnyKernel3 for SM-A135F
      # =========================================================

      - name: Configure AnyKernel3
        working-directory: AnyKernel3
        run: |
          set -e

          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=MAX ARAF KernelSU-Next SUSFS
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=SM-A135F
          device.name2=SM-A135F/DS
          device.name3=a13
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/by-name/boot
          is_slot_device=0

          . tools/ak3-core.sh
          split_boot
          flash_boot
          dump_boot
          write_boot
          exit 0
          EOF

          echo "AnyKernel configuration:"
          cat anykernel.sh


      # =========================================================
      # 15. Create flashable ZIP
      # =========================================================

      - name: Package AnyKernel3
        run: |
          set -e

          cd AnyKernel3

          ZIP_NAME="A135F-4.19.325-MAX-ARAF-KSUN-SUSFS.zip"

          zip -r9 \
            "../$ZIP_NAME" \
            . \
            -x '.git/*' \
            -x 'README.md'

          cd ..

          ls -lh "$ZIP_NAME"


      # =========================================================
      # 16. Create raw kernel artifact
      # =========================================================

      - name: Copy raw kernel
        run: |
          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            "A135F-4.19.325-MAX-ARAF-Image.gz"

          ls -lh \
            "A135F-4.19.325-MAX-ARAF-Image.gz"


      # =========================================================
      # 17. Upload flashable ZIP
      # =========================================================

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: A135F-4.19.325-MAX-ARAF-KSUN-SUSFS
          path: A135F-4.19.325-MAX-ARAF-KSUN-SUSFS.zip
          if-no-files-found: error


      # =========================================================
      # 18. Upload raw Image.gz
      # =========================================================

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: A135F-4.19.325-MAX-ARAF-Image
          path: A135F-4.19.325-MAX-ARAF-Image.gz
          if-no-files-found: error


      # =========================================================
      # 19. Final verification
      # =========================================================

      - name: Build summary
        run: |
          echo "========================================"
          echo "       MAX ARAF KERNEL BUILD"
          echo "========================================"
          echo ""
          echo "Device : SM-A135F/DS"
          echo "Kernel : 4.19.325-MAX-ARAF"
          echo "Root   : KernelSU-Next"
          echo "SUSFS  : Enabled"
          echo ""
          echo "Artifacts:"
          ls -lh \
            A135F-4.19.325-MAX-ARAF-KSUN-SUSFS.zip \
            A135F-4.19.325-MAX-ARAF-Image.gz
          echo ""
          echo "BUILD SUCCESS."
