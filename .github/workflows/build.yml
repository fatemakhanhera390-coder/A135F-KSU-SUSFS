name: A135F KSU-Next + SUSFS v7

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_exynos850.git
  KERNEL_BRANCH: lineage-24.0
  KERNEL_DEFCONFIG: exynos850-a13nsxx_defconfig
  KERNEL_VERSION_EXPECTED: "4.19.325"

  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
  KSU_BRANCH: next

  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_REF: 1.4.2-kernel-4.19

  CLANG_URL: https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r450784e.tar.gz

  Jujutsu_HOOK_URL: https://raw.githubusercontent.com/Iam-nishan/Jujutsu-kernel/V6/syscall_hook.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git libelf-dev libssl-dev lz4 \
            python3 python3-pip rsync \
            tar unzip wget xz-utils \
            gcc-aarch64-linux-gnu

      - name: Fetch A135F kernel
        uses: actions/checkout@v4
        with:
          repository: Samsung-Galaxy-A13-A135F-Development/android_kernel_exynos850
          ref: lineage-24.0
          path: kernel
          fetch-depth: 1

      - name: Verify A135F kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "Kernel commit:"
          git log -1 --oneline

          echo "Kernel version:"
          make kernelversion

          test "$(make kernelversion)" = "4.19.325"

          test -f "arch/arm64/configs/exynos850-a13nsxx_defconfig"

          echo "A135F kernel fetched successfully."

      - name: Install Clang toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/toolchain"
          curl -L --retry 8 --retry-all-errors --connect-timeout 30 \
            --max-time 600 "$CLANG_URL" -o "$RUNNER_TEMP/clang.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$RUNNER_TEMP/toolchain"
          CLANG_BIN="$(find "$RUNNER_TEMP/toolchain" -type f -name clang -perm -111 -print -quit)"
          test -n "$CLANG_BIN"
          echo "TOOLCHAIN=$(dirname "$CLANG_BIN")" >> "$GITHUB_ENV"
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "Toolchain: $CLANG_BIN"
          "$CLANG_BIN" --version | head -n 1

      - name: Configure baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail
          make O=out ARCH=arm64 "$KERNEL_DEFCONFIG"

      - name: Install KernelSU-Next legacy
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          # Official KernelSU-Next non-GKI legacy integration.
          curl -LSs --retry 8 --retry-all-errors --connect-timeout 30 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          test -f drivers/kernelsu/kernel/ksu.c || \
            test -f drivers/kernelsu/ksu.c

          grep -Rqs 'CONFIG_KSU' drivers/kernelsu
          echo "KernelSU-Next legacy driver installed."

      - name: Install SUSFS 1.4.2 kernel sources
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf susfs4ksu

          git clone --depth=1 --branch "$SUSFS_REF" "$SUSFS_REPO" susfs4ksu

          # SUSFS 1.4.2-kernel-4.19 requires these four kernel-side source
          # files. It does NOT require susfs_def.h.
          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/fs/sus_su.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f susfs4ksu/kernel_patches/include/linux/sus_su.h
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          cp -fv susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -fv susfs4ksu/kernel_patches/fs/sus_su.c fs/sus_su.c
          cp -fv susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp -fv susfs4ksu/kernel_patches/include/linux/sus_su.h include/linux/sus_su.h

          test -f fs/susfs.c
          test -f fs/sus_su.c
          test -f include/linux/susfs.h
          test -f include/linux/sus_su.h

          grep -E '^#define SUSFS_VERSION' include/linux/susfs.h || true

      - name: Apply SUSFS and adapt Samsung namespace.c
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          PATCH_FILE="susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"

          cp fs/namespace.c fs/namespace.c.orig
          cp Makefile Makefile.orig
          cp include/linux/fs.h include/linux/fs.h.orig

          # Apply everything that matches. The Samsung-modified namespace.c can
          # have donor hunks that need semantic adaptation below.
          patch --batch --forward -F3 -p1 < "$PATCH_FILE" || true

          echo "=== Initial patch status ==="
          git status --short || true

          echo "=== Reject files ==="
          find . -type f -name '*.rej' -not -path './.git/*' -print || true

          python3 <<'PY'
          from pathlib import Path
          import re

          ns = Path("fs/namespace.c")
          text = ns.read_text()

          def find_function(src, name):
              pattern = re.compile(
                  r'(?m)^\s*(?:static\s+)?[^\n;{}]*\b'
                  + re.escape(name)
                  + r'\s*\([^;{}]*\)\s*\{'
              )
              m = pattern.search(src)
              if not m:
                  raise RuntimeError(f"function not found: {name}")

              brace = src.find("{", m.start(), m.end())
              depth = 0
              quote = None
              esc = False
              line_comment = False
              block_comment = False
              i = brace

              while i < len(src):
                  c = src[i]
                  n = src[i + 1] if i + 1 < len(src) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False
                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1
                  elif quote:
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == quote:
                          quote = None
                  else:
                      if c == "/" and n == "/":
                          line_comment = True
                          i += 1
                      elif c == "/" and n == "*":
                          block_comment = True
                          i += 1
                      elif c in "'\"":
                          quote = c
                      elif c == "{":
                          depth += 1
                      elif c == "}":
                          depth -= 1
                          if depth == 0:
                              return m.start(), i + 1, src[m.start():i + 1]
                  i += 1

              raise RuntimeError(f"unbalanced braces in {name}")

          def statement_span(fn_text, start_at):
              i = start_at
              quote = None
              esc = False
              line_comment = False
              block_comment = False

              while i < len(fn_text):
                  c = fn_text[i]
                  n = fn_text[i + 1] if i + 1 < len(fn_text) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False
                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1
                  elif quote:
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == quote:
                          quote = None
                  else:
                      if c == "/" and n == "/":
                          line_comment = True
                          i += 1
                      elif c == "/" and n == "*":
                          block_comment = True
                          i += 1
                      elif c in "'\"":
                          quote = c
                      elif c == ";":
                          return i + 1
                  i += 1

              raise RuntimeError("unterminated statement")

          def detect_alloc(fn_text):
              out = []
              for m in re.finditer(r'\balloc_vfsmnt\s*\(', fn_text):
                  line_start = fn_text.rfind("\n", 0, m.start()) + 1
                  semi = fn_text.rfind(";", 0, m.start())
                  stmt_start = max(line_start, semi + 1)
                  end = statement_span(fn_text, m.start())

                  stmt = fn_text[stmt_start:end]
                  lhs = re.search(
                      r'\b([A-Za-z_]\w*)\s*=\s*alloc_vfsmnt\s*\(',
                      stmt
                  )
                  if lhs:
                      out.append((stmt_start, end, lhs.group(1), stmt))
              return out

          def render_added(lines, indent):
              rendered = []
              for line in lines:
                  if not line.strip():
                      rendered.append("")
                  else:
                      rendered.append(indent + line.lstrip())
              return "\n".join(rendered)

          targets = ["vfs_kern_mount", "clone_mnt"]
          diagnostics = []
          changed = False

          reject_files = [
              p for p in Path(".").rglob("*.rej")
              if p.as_posix().endswith("fs/namespace.c.rej")
          ]

          if reject_files:
              rej_text = reject_files[0].read_text()
              raw_hunks = re.split(r'(?m)(?=^@@)', rej_text)
              hunks = [h for h in raw_hunks if h.startswith("@@")]

              # Map each reject hunk to its donor function using the function
              # context that appears after the second @@ whenever available.
              hunk_map = {name: [] for name in targets}
              for h in hunks:
                  header = h.splitlines()[0]
                  context = header.split("@@")[-1]
                  for name in targets:
                      if re.search(r'\b' + re.escape(name) + r'\b', context):
                          hunk_map[name].append(h)
                          break

              # Conservative fallback: only use positional mapping when there
              # are exactly two target hunks, matching our known A135F case.
              if not any(hunk_map.values()) and len(hunks) == len(targets):
                  for name, h in zip(targets, hunks):
                      hunk_map[name].append(h)

              for name in targets:
                  try:
                      fs, fe, fn = find_function(text, name)
                  except Exception as e:
                      diagnostics.append(f"{name}: {e}")
                      continue

                  allocs = detect_alloc(fn)
                  if not allocs:
                      diagnostics.append(
                          f"{name}: no alloc_vfsmnt assignment found; refusing blind rewrite"
                      )
                      continue

                  stmt_start, stmt_end, var, stmt = allocs[0]

                  additions = []
                  for h in hunk_map.get(name, []):
                      for line in h.splitlines():
                          if line.startswith(("+++", "---", "@@")):
                              continue
                          if line.startswith("+"):
                              additions.append(line[1:])

                  if not additions:
                      diagnostics.append(f"{name}: no mapped SUSFS additions")
                      continue

                  joined = "\n".join(additions)
                  if not any(x in joined for x in (
                      "susfs_is_current_ksu_domain",
                      "CONFIG_KSU_SUSFS_SUS_MOUNT",
                      "DEFAULT_SUS_MNT_ID",
                  )):
                      diagnostics.append(
                          f"{name}: mapped reject has no expected SUSFS markers"
                      )
                      continue

                  # The target already has its own alloc_vfsmnt() statement.
                  additions = [
                      line for line in additions
                      if not re.search(r'\balloc_vfsmnt\s*\(', line)
                  ]

                  # If the Samsung tree uses a different allocation variable,
                  # translate the donor's plain 'mnt' identifier to that actual
                  # variable. No variable is invented.
                  if var != "mnt":
                      additions = [
                          re.sub(r'\bmnt\b', var, line)
                          for line in additions
                      ]

                  alloc_indent = re.match(r'[ \t]*', stmt).group(0)
                  block = render_added(additions, alloc_indent)

                  insert_at = fs + stmt_end
                  text = text[:insert_at] + "\n" + block.rstrip() + "\n" + text[insert_at:]
                  changed = True

                  diagnostics.append(
                      f"{name}: inserted {len(additions)} donor SUSFS lines "
                      f"after alloc_vfsmnt() using actual variable '{var}'"
                  )

          if changed:
              ns.write_text(text)

          print("=== SUSFS namespace adapter diagnostics ===")
          for item in diagnostics:
              print(item)

          # Never permit an unresolved reject to silently reach the compiler.
          remaining = [
              p for p in Path(".").rglob("*.rej")
              if not any(part == ".git" for part in p.parts)
          ]

          if remaining:
              for p in remaining:
                  print(f"\n--- {p} ---")
                  print(p.read_text())
              raise SystemExit("Unresolved patch rejects remain; refusing to build.")

          # Sanity checks for the two adapted functions.
          final = ns.read_text()
          for name in targets:
              _, _, fn = find_function(final, name)
              if "CONFIG_KSU_SUSFS_SUS_MOUNT" not in fn:
                  raise SystemExit(f"{name}: SUS_MOUNT integration marker missing")
              if "susfs_is_current_ksu_domain" not in fn:
                  raise SystemExit(f"{name}: SUSFS domain marker missing")

          print("SUSFS namespace adaptation completed.")
          PY

          echo "=== SUSFS namespace markers ==="
          grep -n -E \
            'susfs_is_current_ksu_domain|CONFIG_KSU_SUSFS_SUS_MOUNT|DEFAULT_SUS_MNT_ID' \
            fs/namespace.c

      - name: Apply KernelSU manual non-kprobe hooks
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 \
            --max-time 300 "$Jujutsu_HOOK_URL" -o /tmp/syscall_hook.sh

          test -s /tmp/syscall_hook.sh
          chmod +x /tmp/syscall_hook.sh
          /tmp/syscall_hook.sh

          git diff -- \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            fs/stat.c \
            kernel/reboot.c \
            kernel/sys.c || true

      - name: Configure KSU + SUSFS
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          CFG="out/.config"

          ./scripts/config --file "$CFG" \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS

          # Manual KSU hooks are being used; kprobe hooks and SUS_SU are disabled.
          ./scripts/config --file "$CFG" \
            -d CONFIG_KSU_KPROBE_HOOKS \
            -d CONFIG_KPROBE_EVENTS \
            -d CONFIG_KPROBES \
            -d CONFIG_KSU_SUSFS_SUS_SU

          ./scripts/config --file "$CFG" \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME

          ./scripts/config --file "$CFG" \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_MODULES \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL

          make O=out ARCH=arm64 olddefconfig

          echo "=== Final KSU/SUSFS config ==="
          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_SUSFS|CONFIG_KPROBE|CONFIG_KPROBES|CONFIG_MODULES=|CONFIG_OVERLAY_FS=)' \
            out/.config || true

          test "$(grep -c '^CONFIG_KSU=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_KSU_SUSFS=y$' out/.config)" -eq 1
          ! grep -q '^CONFIG_KSU_KPROBE_HOOKS=y$' out/.config
          ! grep -q '^CONFIG_KSU_SUSFS_SUS_SU=y$' out/.config

      - name: Build kernel
        working-directory: kernel
        shell: bash
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          set -euxo pipefail

          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="$TOOLCHAIN/clang" \
            LD="$TOOLCHAIN/ld.lld" \
            AR="$TOOLCHAIN/llvm-ar" \
            NM="$TOOLCHAIN/llvm-nm" \
            OBJCOPY="$TOOLCHAIN/llvm-objcopy" \
            OBJDUMP="$TOOLCHAIN/llvm-objdump" \
            STRIP="$TOOLCHAIN/llvm-strip" \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            Image.gz

          test -s out/arch/arm64/boot/Image.gz

      - name: Verify kernel integration before packaging
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Built image ==="
          ls -lh out/arch/arm64/boot/Image.gz

          echo "=== KSU/SUSFS source markers ==="
          grep -R -n -m 10 'susfs_is_current_ksu_domain' \
            fs include drivers 2>/dev/null || true

          echo "=== Built Image.gz strings ==="
          gzip -dc out/arch/arm64/boot/Image.gz | strings | \
            grep -E 'ksu_|susfs_|SUSFS' | head -n 80 || true

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz

          cat > AnyKernel3/anykernel.sh <<'AK'
          properties() { '
          kernel.string=A135F KSU-Next + SUSFS v7
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=SM-A135F
          device.name2=SM-A135F/DS
          device.name3=a13
          device.name4=a13nsxx
          supported.versions=
          supported.patchlevels=
          '; }
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          dump_boot;
          replace_kernel;
          flash_boot;
          exit 0;
          AK

          cd AnyKernel3
          zip -r9 "../A135F-KSU-SUSFS-v7.zip" . \
            -x '*.git*' 'README.md' 'LICENSE' >/dev/null

      - name: Save diagnostics and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A135F-KSU-SUSFS-v7-artifacts
          path: |
            A135F-KSU-SUSFS-v7.zip
            kernel/fs/namespace.c
            kernel/fs/namespace.c.orig
            kernel/fs/namespace.c.rej
            kernel/out/.config
            kernel/out/arch/arm64/boot/Image.gz
            kernel/.config
          if-no-files-found: warn
