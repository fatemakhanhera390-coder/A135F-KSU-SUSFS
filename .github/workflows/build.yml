name: Build A135F 4.19.325 - MAX ARAF KSU-Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 4.19.325-MAX-ARAF
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      KERNEL_DIR: kernel
      OUT_DIR: out

      KERNEL_REPO: https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git
      KERNEL_BRANCH: lineage-24.0
      DEFCONFIG: exynos850-a13nsxx_defconfig

      # KernelSU-Next branch made specifically for 4.19 SUSFS
      KSU_REPO: https://github.com/SuleMareVientu/KernelSU-Next.git
      KSU_BRANCH: next-susfs-4.19

      # SUSFS kernel-side sources
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: kernel-4.19

      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784.tar.gz

    steps:

      # ============================================================
      # 1. Checkout workflow
      # ============================================================
      - name: Checkout workflow
        uses: actions/checkout@v4


      # ============================================================
      # 2. Free disk space
      # ============================================================
      - name: Free disk space
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          df -h


      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip

          git --version
          gcc --version
          clang --version || true


      # ============================================================
      # 4. Setup Android Clang
      # ============================================================
      - name: Setup Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$HOME/android-clang"
          ARCHIVE="$RUNNER_TEMP/clang-r450784e.tar.gz"

          rm -rf "$TOOLCHAIN"
          mkdir -p "$TOOLCHAIN"

          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784e.tar.gz"

          echo "Downloading official Android clang-r450784e..."
          echo "$URL"

          success=0

          for i in 1 2 3 4 5 6 7 8; do
            echo "Download attempt $i..."

            rm -f "$ARCHIVE"

            if curl -L \
              --fail \
              --connect-timeout 30 \
              --max-time 900 \
              --retry 3 \
              --retry-delay 10 \
              "$URL" \
              -o "$ARCHIVE"; then

              success=1
              break
            fi

            echo "Attempt $i failed. Waiting..."
            sleep 15
          done

          if [ "$success" -ne 1 ]; then
            echo "ERROR: Unable to download Android clang-r450784e"
            exit 1
          fi

          test -s "$ARCHIVE"

          echo "Extracting clang..."
          tar -xzf "$ARCHIVE" -C "$TOOLCHAIN"

          echo "Checking clang..."

                    test -x "$TOOLCHAIN/bin/clang"
          test -x "$TOOLCHAIN/bin/ld.lld"

          echo "LLVM_HOME=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN/bin/clang" --version
          "$TOOLCHAIN/bin/ld.lld" --version

          echo "Android clang-r450784e ready."


      # ============================================================
      # 5. Verify toolchain
      # ============================================================
      - name: Verify toolchain
        shell: bash
        run: |
          set -eux

          test -x "$LLVM_HOME/bin/clang"
          test -x "$LLVM_HOME/bin/ld.lld"

          "$LLVM_HOME/bin/clang" --version
          "$LLVM_HOME/bin/ld.lld" --version

          echo "Clang verification passed."


      # ============================================================
      # 6. Fetch A135F kernel
      # ============================================================
      - name: Fetch A135F kernel
        run: |
          set -euxo pipefail

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "Kernel commit:"
          git log -1 --oneline

          echo "Kernel version:"
          make kernelversion

          test "$(make kernelversion)" = "4.19.325"

          echo "Checking defconfig..."
          test -f "arch/arm64/configs/$DEFCONFIG"

          echo "Kernel source verified."


      # ============================================================
      # 7. Install KernelSU-Next 4.19 SUSFS branch
      # ============================================================
      - name: Install KernelSU-Next 4.19 SUSFS
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          rm -rf KernelSU-Next

          echo "Cloning KernelSU-Next..."
          git clone \
            --depth=1 \
            --branch "$KSU_BRANCH" \
            "$KSU_REPO" \
            KernelSU-Next

          test -d KernelSU-Next/kernel

          echo "KernelSU-Next commit:"
          git -C KernelSU-Next log -1 --oneline

          echo "Running KernelSU-Next setup..."

          cd KernelSU-Next

          chmod +x kernel/setup.sh

          ./kernel/setup.sh legacy

          cd ..

          test -L drivers/kernelsu
          test -d drivers/kernelsu

          echo "KernelSU-Next installed."

          echo "Checking SUSFS Kconfig..."

          grep -R "CONFIG_KSU_SUSFS" \
            drivers/kernelsu \
            | head -30 || true


      # ============================================================
      # 8. Install SUSFS kernel-side 4.19
      # ============================================================
      - name: Install SUSFS kernel-side 4.19
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          rm -rf susfs4ksu

          echo "Cloning SUSFS kernel-4.19..."
          git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            "$SUSFS_REPO" \
            susfs4ksu

          echo "SUSFS commit:"
          git -C susfs4ksu log -1 --oneline

          echo "Checking SUSFS files..."

          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          echo "Copying SUSFS kernel files..."

          cp -fv \
            susfs4ksu/kernel_patches/fs/* \
            fs/

          cp -fv \
            susfs4ksu/kernel_patches/include/linux/* \
            include/linux/

          echo "Checking susfs.h BEFORE patch..."

          test -f include/linux/susfs.h

          ls -lh include/linux/susfs.h
          ls -lh fs/susfs.c

          echo "Applying SUSFS 4.19 kernel patch..."

          patch -p1 \
            < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          echo "SUSFS kernel patch applied."

          echo "Final SUSFS files:"
          test -f include/linux/susfs.h
          test -f fs/susfs.c

          echo "SUSFS kernel-side integration verified."


      # ============================================================
      # 9. Apply manual hooks for non-GKI 4.19
      # ============================================================
      - name: Apply KernelSU manual hooks
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          echo "Applying manual hooks..."

          curl -L --fail \
            https://raw.githubusercontent.com/Iam-nishan/Jujutsu-kernel/V6/syscall_hook.sh \
            -o syscall_hook.sh

          chmod +x syscall_hook.sh

          bash syscall_hook.sh

          echo "Manual hooks applied."

          echo "Checking patched kernel files..."

          grep -R "CONFIG_KSU_MANUAL_HOOK" \
            fs kernel \
            2>/dev/null | head -20 || true


      # ============================================================
      # 10. Prepare build directory
      # ============================================================
      - name: Prepare build directory
        run: |
          set -eux

          cd "$KERNEL_DIR"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          echo "Build directory ready."


      # ============================================================
      # 11. Configure A135F kernel
      # ============================================================
      - name: Configure A135F kernel
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            "$DEFCONFIG"

          echo "Applying KernelSU/SUSFS config..."

          ./scripts/config --file "$OUT_DIR/.config" \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_MANUAL_HOOK \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_OVERLAY_FS \
            --disable CONFIG_LTO \
            --disable CONFIG_LTO_CLANG \
            --disable CONFIG_WERROR \
            --set-str CONFIG_LOCALVERSION "-MAX-ARAF"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            olddefconfig

          echo "Kernel configuration completed."


      # ============================================================
      # 12. Verify KSU + SUSFS before build
      # ============================================================
      - name: Verify KSU SUSFS integration
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          echo "========== CONFIG =========="

          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_' \
            "$OUT_DIR/.config" \
            | head -100

          echo "========== SUSFS HEADER =========="

          test -f include/linux/susfs.h

          grep -n "susfs" \
            include/linux/susfs.h \
            | head -20 || true

          echo "========== SUSFS SOURCE =========="

          test -f fs/susfs.c

          echo "========== KSU SOURCE =========="

          test -d drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          echo "========== HEADER COMPILE TEST =========="

          grep -n 'linux/susfs.h' \
            drivers/kernelsu/su.c \
            drivers/kernelsu/ksu.c \
            2>/dev/null || true

          echo "KSU + SUSFS integration verified before compilation."


      # ============================================================
      # 13. Build kernel
      # ============================================================
      - name: Build kernel
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          export PATH="$LLVM_HOME/bin:$PATH"

          echo "Compiler:"
          clang --version

          echo "Building kernel..."

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            KCFLAGS="-Wno-error=strict-prototypes" \
            -j"$(nproc)"

          echo "Kernel build completed."


      # ============================================================
      # 14. Verify kernel image
      # ============================================================
      - name: Verify kernel image
        run: |
          set -eux

          cd "$KERNEL_DIR"

          IMAGE="arch/arm64/boot/Image.gz"

          test -f "$IMAGE"

          ls -lh "$IMAGE"

          echo "Kernel Image.gz successfully built."


      # ============================================================
      # 15. Prepare AnyKernel3
      # ============================================================
      - name: Prepare AnyKernel3
        run: |
          set -euxo pipefail

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          cp \
            "$KERNEL_DIR/arch/arm64/boot/Image.gz" \
            AnyKernel3/Image.gz

          cd AnyKernel3

          sed -i \
            's/^kernel.string=.*/kernel.string=A135F 4.19.325 MAX ARAF KernelSU-Next SUSFS/' \
            anykernel.sh

          sed -i \
            's/^device.name1=.*/device.name1=SM-A135F/' \
            anykernel.sh

          sed -i \
            's/^device.name2=.*/device.name2=a13/' \
            anykernel.sh

          echo "AnyKernel3 prepared."

          grep -E \
            'kernel.string|device.name' \
            anykernel.sh || true


      # ============================================================
      # 16. Package flashable ZIP
      # ============================================================
      - name: Package kernel ZIP
        run: |
          set -eux

          cd AnyKernel3

          rm -rf .git
          rm -f README.md
          rm -f LICENSE

          ZIP_NAME="A135F-4.19.325-MAX-ARAF-KSU-Next
