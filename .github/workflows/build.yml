name: A135F KernelSU-Next SUSFS MAX ARAF

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git
  KERNEL_BRANCH: lineage-24.0
  DEFCONFIG: exynos850-a13nsxx_defconfig

  KSU_REPO: https://github.com/SuleMareVientu/KernelSU-Next.git
  KSU_BRANCH: next-susfs-4.19

  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: kernel-4.19

  KERNEL_LOCALVERSION: -MAX-ARAF

jobs:
  build:
    name: Build A135F KernelSU-Next SUSFS
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. FREE DISK
      # ============================================================
      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true

          df -h

      # ============================================================
      # 2. CHECKOUT THIS REPOSITORY
      # ============================================================
      - name: Checkout build repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cpio \
            curl \
            flex \
            gawk \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      # ============================================================
      # 4. SETUP ANDROID CLANG
      #
      # r450784e is deliberately used for this 4.19 kernel.
      # GitHub mirror is used instead of android.googlesource
      # because we already hit repeated HTTP 503 there.
      # ============================================================
      - name: Setup Android Clang r450784e
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$HOME/android-clang"
          ARCHIVE="$RUNNER_TEMP/clang-r450784e.tar.gz"

          URL="https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r450784e.tar.gz"

          rm -rf "$TOOLCHAIN"
          mkdir -p "$TOOLCHAIN"

          echo "Downloading clang-r450784e..."

          curl -fL \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            "$URL" \
            -o "$ARCHIVE"

          test -s "$ARCHIVE"

          echo "Extracting toolchain..."

          tar -xzf "$ARCHIVE" -C "$TOOLCHAIN"

          echo "Checking required LLVM binaries..."

          test -x "$TOOLCHAIN/bin/clang"

          # ld.lld / llvm tools can be symlinks.
          test -e "$TOOLCHAIN/bin/ld.lld"
          test -x "$TOOLCHAIN/bin/ld.lld"

          test -e "$TOOLCHAIN/bin/lld"
          test -x "$TOOLCHAIN/bin/lld"

          test -x "$TOOLCHAIN/bin/llvm-ar"
          test -x "$TOOLCHAIN/bin/llvm-nm"
          test -x "$TOOLCHAIN/bin/llvm-objcopy"
          test -x "$TOOLCHAIN/bin/llvm-objdump"
          test -x "$TOOLCHAIN/bin/llvm-strip"
          test -x "$TOOLCHAIN/bin/llvm-readelf"
          test -x "$TOOLCHAIN/bin/llvm-size"

          echo "LLVM_HOME=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN/bin/clang" --version
          "$TOOLCHAIN/bin/ld.lld" --version

          echo "Android clang-r450784e ready."

      # ============================================================
      # 5. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify toolchain
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$LLVM_HOME/bin/clang"
          test -e "$LLVM_HOME/bin/ld.lld"
          test -x "$LLVM_HOME/bin/ld.lld"

          "$LLVM_HOME/bin/clang" --version
          "$LLVM_HOME/bin/ld.lld" --version

          command -v python3
          command -v make
          command -v git

          echo "Toolchain verification passed."

      # ============================================================
      # 6. FETCH A135F KERNEL
      # ============================================================
      - name: Fetch A135F kernel
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            kernel

          cd kernel

          echo "Kernel source:"
          git remote -v

          echo "Kernel commit:"
          git log -1 --oneline

          echo "Kernel version:"
          make kernelversion

          test "$(make kernelversion)" = "4.19.325"

          test -f "arch/arm64/configs/$DEFCONFIG"

          echo "A135F kernel source verification passed."

      # ============================================================
      # 7. INSTALL KERNELSU-NEXT SUSFS-AWARE BRANCH
      #
      # IMPORTANT:
      # DO NOT APPLY the old
      # 10_enable_susfs_for_ksu.patch here.
      #
      # This KSU-Next branch already contains the SUSFS-side
      # KSU integration/configuration.
      # ============================================================
      - name: Install KernelSU-Next SUSFS 4.19
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf KernelSU-Next

          git clone \
            --depth=1 \
            --branch "$KSU_BRANCH" \
            "$KSU_REPO" \
            KernelSU-Next

          test -d KernelSU-Next/kernel
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile

          echo "Checking KernelSU-Next SUSFS support..."

          grep -q "config KSU_SUSFS" \
            KernelSU-Next/kernel/Kconfig

          grep -q "KSU_SUSFS" \
            KernelSU-Next/kernel/Kconfig

          grep -q "susfs.c" \
            KernelSU-Next/kernel/Makefile || true

          rm -rf drivers/kernelsu

          ln -s \
            "$(pwd)/KernelSU-Next/kernel" \
            drivers/kernelsu

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU-Next integration prepared."

      # ============================================================
      # 8. INSTALL SUSFS KERNEL-SIDE SOURCES
      # ============================================================
      - name: Install SUSFS kernel sources
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf susfs4ksu

          git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            "$SUSFS_REPO" \
            susfs4ksu

          # Required SUSFS files
          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/fs/sus_su.c

          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f susfs4ksu/kernel_patches/include/linux/sus_su.h

          test -f \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          # Copy kernel-side SUSFS sources.
          cp -fv \
            susfs4ksu/kernel_patches/fs/susfs.c \
            fs/susfs.c

          cp -fv \
            susfs4ksu/kernel_patches/fs/sus_su.c \
            fs/sus_su.c

          cp -fv \
            susfs4ksu/kernel_patches/include/linux/susfs.h \
            include/linux/susfs.h

          cp -fv \
            susfs4ksu/kernel_patches/include/linux/sus_su.h \
            include/linux/sus_su.h

          # Verify copies.
          test -f fs/susfs.c
          test -f fs/sus_su.c
          test -f include/linux/susfs.h
          test -f include/linux/sus_su.h

          echo "SUSFS kernel sources installed."

          echo "SUSFS version:"
          grep -E '^#define SUSFS_VERSION' \
            include/linux/susfs.h || true

      # ============================================================
      # 9. APPLY SUSFS KERNEL PATCH
      #
      # Dry-run first.
      # If already applied, detect it instead of failing.
      # No fuzzy/unsafe patching.
      # ============================================================
      - name: Apply SUSFS kernel patch
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          PATCH_FILE="susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"

          test -f "$PATCH_FILE"

          echo "Testing SUSFS kernel patch..."

          if patch \
              --dry-run \
              --batch \
              --forward \
              --fuzz=0 \
              -p1 < "$PATCH_FILE"
          then
            echo "SUSFS patch applies cleanly."

            patch \
              --batch \
              --forward \
              --fuzz=0 \
              -p1 < "$PATCH_FILE"

          else
            echo "Forward patch did not apply."

            echo "Checking whether it is already applied..."

            if patch \
                --dry-run \
                --batch \
                --reverse \
                --fuzz=0 \
                -p1 < "$PATCH_FILE"
            then
              echo "SUSFS kernel patch is already applied."
            else
              echo "ERROR: SUSFS 4.19 patch is neither cleanly applicable nor already applied."
              echo "Stopping before kernel build."
              exit 1
            fi
          fi

          test -f fs/susfs.c
          test -f fs/sus_su.c
          test -f include/linux/susfs.h
          test -f include/linux/sus_su.h

          echo "SUSFS kernel patch stage passed."

      # ============================================================
      # 10. MANUAL KERNELSU HOOKS
      #
      # Required for legacy 4.19.
      # KPROBES remain disabled.
      # ============================================================
      - name: Apply KernelSU manual hooks
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          curl -fL \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            "https://raw.githubusercontent.com/Iam-nishan/Jujutsu-kernel/V6/syscall_hook.sh" \
            -o /tmp/syscall_hook.sh

          test -s /tmp/syscall_hook.sh

          chmod +x /tmp/syscall_hook.sh

          bash /tmp/syscall_hook.sh

          echo "Checking manual hooks..."

          grep -q "ksu_handle_execveat" \
            fs/exec.c

          grep -q "ksu_handle_faccessat" \
            fs/open.c

          grep -q "ksu_handle_sys_read" \
            fs/read_write.c

          grep -q "ksu_handle_stat" \
            fs/stat.c

          grep -q "ksu_handle_sys_reboot" \
            kernel/reboot.c

          grep -q "ksu_handle_setresuid" \
            kernel/sys.c

          echo "KernelSU manual hooks verified."

      # ============================================================
      # 11. PRE-BUILD SOURCE VERIFICATION
      # ============================================================
      - name: Verify KernelSU and SUSFS integration
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          echo "========== Kernel =========="
          make kernelversion

          echo "========== KernelSU =========="

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          test -f drivers/kernelsu/ksu.c
          test -f drivers/kernelsu/core_hook.c

          echo "========== SUSFS =========="

          test -f fs/susfs.c
          test -f fs/sus_su.c
          test -f include/linux/susfs.h
          test -f include/linux/sus_su.h

          grep -q "config KSU_SUSFS" \
            drivers/kernelsu/Kconfig

          grep -q "#include <linux/susfs.h>" \
            drivers/kernelsu/core_hook.c

          echo "========== SUSFS version =========="

          grep -E '^#define SUSFS_VERSION' \
            include/linux/susfs.h

          echo "========== Manual hooks =========="

          grep -R "ksu_handle_" \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            fs/stat.c \
            kernel/reboot.c \
            kernel/sys.c

          echo "All source-level checks passed."

      # ============================================================
      # 12. CONFIGURE KERNEL
      # ============================================================
      - name: Configure A135F KernelSU-Next SUSFS
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

          ./scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            --enable CONFIG_KSU_SUSFS_TRY_UMOUNT \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            --disable CONFIG_KSU_SUSFS_SUS_SU \
            --disable CONFIG_KPROBES \
            --disable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_OVERLAY_FS \
            --disable CONFIG_LTO_CLANG \
            --disable CONFIG_THINLTO \
            --enable CONFIG_LTO_NONE \
            --disable CONFIG_WERROR \
            --disable CONFIG_LOCALVERSION_AUTO \
            --set-str CONFIG_LOCALVERSION "$KERNEL_LOCALVERSION"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "========== Final KSU config =========="

          grep -E \
            'CONFIG_KSU(=|_)|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_OVERLAY_FS|CONFIG_LTO|CONFIG_WERROR|CONFIG_LOCALVERSION' \
            out/.config || true

          echo "========== Required values =========="

          grep -q '^CONFIG_KSU=y$' \
            out/.config

          grep -q '^CONFIG_KSU_SUSFS=y$' \
            out/.config

          grep -q '^CONFIG_OVERLAY_FS=y$' \
            out/.config

          grep -q '^# CONFIG_KPROBES is not set$' \
            out/.config

          grep -q '^# CONFIG_KPROBE_EVENTS is not set$' \
            out/.config

          grep -q '^CONFIG_LOCALVERSION="-MAX-ARAF"$' \
            out/.config

          echo "Kernel configuration passed."

      # ============================================================
      # 13. BUILD KERNEL
      #
      # Host tools use Ubuntu GCC.
      # Target kernel uses Android LLVM.
      # ============================================================
      - name: Build kernel
        shell: bash
        working-directory: kernel
        env:
          KBUILD_BUILD_USER: MAX-ARAF
          KBUILD_BUILD_HOST: MAX-ARAF-A135F
          KBUILD_BUILD_VERSION: "1"
        run: |
          set -euxo pipefail

          echo "Compiler:"
          "$LLVM_HOME/bin/clang" --version

          echo "Linker:"
          "$LLVM_HOME/bin/ld.lld" --version

          echo "Starting kernel build..."

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$LLVM_HOME/bin/clang" \
            LD="$LLVM_HOME/bin/ld.lld" \
            AR="$LLVM_HOME/bin/llvm-ar" \
            NM="$LLVM_HOME/bin/llvm-nm" \
            OBJCOPY="$LLVM_HOME/bin/llvm-objcopy" \
            OBJDUMP="$LLVM_HOME/bin/llvm-objdump" \
            STRIP="$LLVM_HOME/bin/llvm-strip" \
            READELF="$LLVM_HOME/bin/llvm-readelf" \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTAR=/usr/bin/ar \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=strict-prototypes" \
            -j2 \
            Image.gz

          echo "Kernel build command completed."

      # ============================================================
      # 14. VERIFY BUILT KERNEL
      # ============================================================
      - name: Verify kernel image
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          test -f out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/Image.gz

          echo "Image.gz:"
          ls -lh out/arch/arm64/boot/Image.gz

          echo "Searching for DTB outputs..."

          find out/arch/arm64/boot \
            -type f \
            \( -name "*.dtb" -o -name "Image.gz-dtb" \) \
            -print || true

          echo "Kernel image verification passed."

      # ============================================================
      # 15. BUILD ANYKERNEL3 PACKAGE
      # ============================================================
      - name: Package AnyKernel3
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          cp \
            out/arch/arm64/boot/Image.gz \
            AnyKernel3/Image.gz

          test -s AnyKernel3/Image.gz

          cd AnyKernel3

          # A135F is a non-A/B boot partition.
          # Device check is disabled deliberately because the current
          # ROM is a port and ro.product.device can vary.
          sed -i \
            's/^do.devicecheck=.*/do.devicecheck=0/' \
            anykernel.sh

          sed -i \
            's/^do.modules=.*/do.modules=0/' \
            anykernel.sh

          sed -i \
            's/^do.systemless=.*/do.systemless=0/' \
            anykernel.sh

          sed -i \
            's/^is_slot_device=.*/is_slot_device=0;/' \
            anykernel.sh

          sed -i \
            's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' \
            anykernel.sh

          sed -i \
            's/^kernel.string=.*/kernel.string=MAX ARAF KernelSU-Next + SUSFS 4.19.325/' \
            anykernel.sh

          echo "========== AnyKernel configuration =========="

          grep -E \
            'kernel.string|do.devicecheck|do.modules|do.systemless|block=|is_slot_device' \
            anykernel.sh

          echo "Building flashable ZIP..."

          zip -r9 \
            ../A135F-KSU-Next-SUSFS-MAX-ARAF.zip \
            . \
            -x ".git/*" \
            -x ".github/*"

          cd ..

          test -s A135F-KSU-Next-SUSFS-MAX-ARAF.zip

          echo "AnyKernel3 package:"
          ls -lh A135F-KSU-Next-SUSFS-MAX-ARAF.zip

      # ============================================================
      # 16. SAVE ARTIFACTS
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A135F-KSU-Next-SUSFS-MAX-ARAF
          if-no-files-found: error
          compression-level: 0
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/A135F-KSU-Next-SUSFS-MAX-ARAF.zip

      # ============================================================
      # 17. FINAL SUMMARY
      # ============================================================
      - name: Build summary
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          echo "=============================================="
          echo "       MAX ARAF A135F KERNEL BUILD"
          echo "=============================================="
          echo
          echo "Kernel:"
          make kernelversion
          echo
          echo "KernelSU:"
          grep '^CONFIG_KSU=y$' out/.config
          echo
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -E '^#define SUSFS_VERSION' include/linux/susfs.h
          echo
          echo "Localversion:"
          grep '^CONFIG_LOCALVERSION=' out/.config
          echo
          echo "Kernel image:"
          ls -lh out/arch/arm64/boot/Image.gz
          echo
          echo "AnyKernel3:"
          ls -lh A135F-KSU-Next-SUSFS-MAX-ARAF.zip
          echo
          echo "=============================================="
          echo "              BUILD SUCCESS"
          echo "=============================================="
