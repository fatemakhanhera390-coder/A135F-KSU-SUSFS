name: A135F KernelSU-Next SUSFS MAX ARAF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build A135F 4.19.325 KSU-Next SUSFS
    runs-on: ubuntu-24.04

    env:
      KERNEL_REPO: https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git
      KERNEL_BRANCH: lineage-24.0
      DEFCONFIG: exynos850-a13nsxx_defconfig

      KSU_REPO: https://github.com/SuleMareVientu/KernelSU-Next.git
      KSU_BRANCH: next-susfs-4.19

      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: kernel-4.19

      KERNEL_TAG: -MAX-ARAF

    steps:

      # ============================================================
      # 1. Checkout workflow
      # ============================================================

      - name: Checkout workflow
        uses: actions/checkout@v4

      # ============================================================
      # 2. Free disk space
      # ============================================================

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell

          sudo apt-get clean

          df -h

      # ============================================================
      # 3. Install dependencies
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip \
            zstd \
            gcc \
            g++ \
            file

          git --version
          gcc --version
          python3 --version

      # ============================================================
      # 4. Setup Android Clang
      # GitHub mirror instead of android.googlesource 503
      # ============================================================

      - name: Setup Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$HOME/android-clang"
          ARCHIVE="$RUNNER_TEMP/clang-r450784e.tar.gz"

          URL="https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r450784e.tar.gz"

          rm -rf "$TOOLCHAIN"
          mkdir -p "$TOOLCHAIN"

          echo "Downloading Android clang-r450784e..."

          curl -fL \
            --retry 8 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            "$URL" \
            -o "$ARCHIVE"

          test -s "$ARCHIVE"

          echo "Extracting clang..."

          tar -xzf "$ARCHIVE" -C "$TOOLCHAIN"

          echo "Checking Android Clang..."

          # IMPORTANT:
          # ld.lld is a symlink to lld in Android Clang.
          # Do NOT use find -type f here.

          test -x "$TOOLCHAIN/bin/clang"
          test -e "$TOOLCHAIN/bin/ld.lld"
          test -x "$TOOLCHAIN/bin/ld.lld"

          test -x "$TOOLCHAIN/bin/lld"
          test -x "$TOOLCHAIN/bin/llvm-ar"
          test -x "$TOOLCHAIN/bin/llvm-nm"
          test -x "$TOOLCHAIN/bin/llvm-objcopy"
          test -x "$TOOLCHAIN/bin/llvm-objdump"
          test -x "$TOOLCHAIN/bin/llvm-strip"
          test -x "$TOOLCHAIN/bin/llvm-readelf"
          test -x "$TOOLCHAIN/bin/llvm-size"

          echo "LLVM_HOME=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          echo
          echo "===== CLANG ====="
          "$TOOLCHAIN/bin/clang" --version

          echo
          echo "===== LLD ====="
          "$TOOLCHAIN/bin/ld.lld" --version

          echo
          echo "===== LLVM TOOLS ====="
          "$TOOLCHAIN/bin/llvm-ar" --version | head -n 1
          "$TOOLCHAIN/bin/llvm-nm" --version | head -n 1

          echo
          echo "Android clang-r450784e ready."

      # ============================================================
      # 5. Verify toolchain
      # ============================================================

      - name: Verify toolchain
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$LLVM_HOME/bin/clang"
          test -x "$LLVM_HOME/bin/ld.lld"

          "$LLVM_HOME/bin/clang" --version
          "$LLVM_HOME/bin/ld.lld" --version

          command -v git
          command -v make

          echo "LLVM_HOME=$LLVM_HOME"
          echo "Toolchain verification passed."

      # ============================================================
      # 6. Fetch A135F kernel
      # ============================================================

      - name: Fetch A135F kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel

          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            kernel

          cd kernel

          echo "Kernel commit:"
          git log -1 --oneline

          echo "Kernel version:"
          make kernelversion

          test "$(make kernelversion)" = "4.19.325"

      # ============================================================
      # 7. Setup KernelSU-Next 4.19 SUSFS branch
      # ============================================================

      - name: Install KernelSU-Next
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf KernelSU-Next
          rm -rf drivers/kernelsu

          echo "Installing KernelSU-Next:"
          echo "$KSU_BRANCH"

          git clone \
            --depth=1 \
            --branch "$KSU_BRANCH" \
            "$KSU_REPO" \
            KernelSU-Next

          test -d KernelSU-Next/kernel
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Kbuild

          ln -sfn "$(pwd)/KernelSU-Next/kernel" drivers/kernelsu

          echo "KernelSU-Next commit:"
          git -C KernelSU-Next log -1 --oneline

          echo "KernelSU kernel directory:"
          ls -la KernelSU-Next/kernel | head

      # ============================================================
      # 8. Install SUSFS kernel-side sources
      # ============================================================

      - name: Install SUSFS kernel sources
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf susfs4ksu

          echo "Cloning SUSFS:"
          echo "$SUSFS_BRANCH"

          git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            "$SUSFS_REPO" \
            susfs4ksu

          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          test -f susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          echo "Copying SUSFS filesystem sources..."

          cp -fv \
            susfs4ksu/kernel_patches/fs/* \
            fs/

          echo "Copying SUSFS headers..."

          cp -fv \
            susfs4ksu/kernel_patches/include/linux/* \
            include/linux/

          test -f fs/susfs.c
          test -f include/linux/susfs.h

          echo "SUSFS kernel files installed."

      # ============================================================
      # 9. Apply SUSFS patch to KernelSU-Next
      # ============================================================

      - name: Patch KernelSU-Next for SUSFS
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "Applying KernelSU SUSFS integration patch..."

          patch \
            -d KernelSU-Next \
            -p1 \
            --forward \
            --verbose \
            < susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          echo "KernelSU SUSFS patch applied."

          test -f KernelSU-Next/kernel/Kconfig

          grep -q "config KSU_SUSFS" \
            KernelSU-Next/kernel/Kconfig

          echo "KSU SUSFS config detected."

      # ============================================================
      # 10. Apply SUSFS kernel 4.19 patch
      # ============================================================

      - name: Patch kernel for SUSFS
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "Applying SUSFS kernel-4.19 patch..."

          patch \
            -p1 \
            --forward \
            --verbose \
            < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          echo "SUSFS kernel patch applied."

          test -f fs/susfs.c
          test -f include/linux/susfs.h

      # ============================================================
      # 11. Apply manual syscall hooks
      # ============================================================

      - name: Apply A135F 4.19 manual hooks
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "Applying manual syscall hooks..."

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://raw.githubusercontent.com/Iam-nishan/Jujutsu-kernel/V6/syscall_hook.sh" \
            -o /tmp/syscall_hook.sh

          chmod +x /tmp/syscall_hook.sh

          bash /tmp/syscall_hook.sh

          echo "Manual hooks completed."

      # ============================================================
      # 12. Prepare output
      # ============================================================

      - name: Prepare build directory
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out

      # ============================================================
      # 13. Configure kernel
      # ============================================================

      - name: Configure A135F kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

          ./scripts/config --file out/.config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_MANUAL_HOOK \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_TRY_UMOUNT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            --enable CONFIG_OVERLAY_FS \
            --disable CONFIG_LTO_CLANG \
            --disable CONFIG_THINLTO \
            --disable CONFIG_LTO_NONE

          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "$KERNEL_TAG"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "===== IMPORTANT CONFIG ====="

          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KPROBES=|CONFIG_KPROBE_EVENTS=|CONFIG_LOCALVERSION=' \
            out/.config || true

      # ============================================================
      # 14. Verify SUSFS integration before build
      # ============================================================

      - name: Verify KernelSU SUSFS integration
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking SUSFS files..."

          test -f fs/susfs.c
          test -f include/linux/susfs.h

          echo "Checking KernelSU SUSFS config..."

          grep -q 'CONFIG_KSU=y' out/.config
          grep -q 'CONFIG_KSU_SUSFS=y' out/.config

          echo "Checking KernelSU source..."

          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Kbuild

          grep -q 'KSU_SUSFS' KernelSU-Next/kernel/Kconfig

          echo "Checking SUSFS version..."

          grep -E \
            '^#define SUSFS_VERSION' \
            include/linux/susfs.h || true

          echo
          echo "======================================"
          echo "KernelSU-Next + SUSFS integration OK"
          echo "======================================"

      # ============================================================
      # 15. Build kernel
      # ============================================================

      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$LLVM_HOME/bin:$PATH"

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export CC="$LLVM_HOME/bin/clang"
          export LD="$LLVM_HOME/bin/ld.lld"

          export AR="$LLVM_HOME/bin/llvm-ar"
          export NM="$LLVM_HOME/bin/llvm-nm"
          export OBJCOPY="$LLVM_HOME/bin/llvm-objcopy"
          export OBJDUMP="$LLVM_HOME/bin/llvm-objdump"
          export STRIP="$LLVM_HOME/bin/llvm-strip"
          export READELF="$LLVM_HOME/bin/llvm-readelf"
          export OBJSIZE="$LLVM_HOME/bin/llvm-size"

          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++

          echo "Compiler:"
          "$CC" --version

          echo
          echo "Starting kernel build..."

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CC" \
            LD="$LD" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            -j2

      # ============================================================
      # 16. Verify kernel output
      # ============================================================

      - name: Verify kernel output
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking kernel output..."

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' || true

          test -f out/arch/arm64/boot/Image.gz

          echo
          echo "Kernel build successful."

          ls -lh out/arch/arm64/boot/Image.gz

          file out/arch/arm64/boot/Image.gz

      # ============================================================
      # 17. Download AnyKernel3
      # ============================================================

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf AnyKernel3/.git

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            AnyKernel3/

      # ============================================================
      # 18. Configure AnyKernel3
      # ============================================================

      - name: Configure AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cd AnyKernel3

          sed -i \
            's/^kernel.string=.*/kernel.string=A135F KernelSU-Next SUSFS MAX ARAF/' \
            anykernel.sh

          sed -i \
            's/^device.name1=.*/device.name1=SM-A135F/' \
            anykernel.sh

          sed -i \
            's/^device.name2=.*/device.name2=SM-A135F\/DS/' \
            anykernel.sh

          echo
          echo "AnyKernel3 configuration:"
          grep -E \
            'kernel.string|device.name' \
            anykernel.sh || true

      # ============================================================
      # 19. Package kernel
      # ============================================================

      - name: Package kernel ZIP
        shell: bash
        run: |
          set -euxo pipefail

          cd AnyKernel3

          zip -r9 \
            "../A135F-KSU-Next-SUSFS-MAX-ARAF.zip" \
            . \
            -x "*.git*" \
            -x "README.md"

          cd ..

          ls -lh \
            A135F-KSU-Next-SUSFS-MAX-ARAF.zip \
            AnyKernel3/Image.gz

      # ============================================================
      # 20. Upload artifacts
      # ============================================================

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A135F-KSU-Next-SUSFS-MAX-ARAF
          path: |
            A135F-KSU-Next-SUSFS-MAX-ARAF.zip
            AnyKernel3/Image.gz
            kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 21. Final summary
      # ============================================================

      - name: Build summary
        shell: bash
        run: |
          echo "=============================================="
          echo " A135F KernelSU-Next + SUSFS BUILD COMPLETE"
          echo "=============================================="
          echo
          echo "Device       : SM-A135F/DS"
          echo "Kernel       : 4.19.325"
          echo "KSU          : KernelSU-Next"
          echo "SUSFS        : kernel-4.19"
          echo "Kernel tag   : MAX-ARAF"
          echo "Architecture : arm64"
          echo
          echo "Artifacts:"
          ls -lh \
            A135F-KSU-Next-SUSFS-MAX-ARAF.zip \
            AnyKernel3/Image.gz
