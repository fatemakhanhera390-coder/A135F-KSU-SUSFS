name: A135F KSU-Next SUSFS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: config.env

    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4

      - name: Clone KernelSU Action build system
        run: |
          git clone --depth=1 https://github.com/xiaoleGun/KernelSU_Action.git build-system
          mkdir -p kernel_workspace

      - name: Create build configuration
        run: |
          cat > config.env <<'EOF'
          KERNEL_SOURCE=https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git
          KERNEL_SOURCE_BRANCH=lineage-24.0
          KERNEL_CONFIG=exynos850-a13nsxx_defconfig
          KERNEL_IMAGE_NAME=Image.gz
          ARCH=arm64

          KERNEL_NAME=A135F-KSU-SUSFS

          USE_CUSTOM_CLANG=false
          CLANG_BRANCH=master-kernel-build-2022
          CLANG_VERSION=r450784e

          USE_LLVM=false
          ENABLE_GCC_ARM64=true
          ENABLE_GCC_ARM32=false

          KSU_VARIANT=kernelsu-next
          KSU_REF=legacy
          KSU_HOOK_MODE=manual

          ENABLE_SUSFS=true
          SUSFS_BRANCH=kernel-4.19

          ENABLE_PATH_UMOUNT=true
          ENABLE_HIDE_STUFF=false

          ADD_OVERLAYFS_CONFIG=true
          ADD_KPROBES_CONFIG=false

          DISABLE_LTO=false
          DISABLE_CC_WERROR=true

          ENABLE_CCACHE=true
          REMOVE_UNUSED_PACKAGES=true

          BUILD_BOOT_IMG=false
          EOF

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl \
            device-tree-compiler flex git libelf-dev \
            libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Resolve configuration
        run: |
          bash build-system/scripts/config.sh

      - name: Setup compiler
        run: |
          bash build-system/scripts/toolchain.sh

      - name: Fetch kernel source
        run: |
          bash build-system/scripts/source.sh

      - name: Install KernelSU-Next
        run: |
          bash build-system/scripts/kernelsu.sh

      - name: Apply KernelSU and SUSFS patches
        run: |
          bash build-system/scripts/patches.sh all

      - name: Build kernel
        run: |
          bash build-system/scripts/build.sh all

      - name: Package AnyKernel3
        run: |
          bash build-system/scripts/package.sh anykernel3

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: A135F-Kernel-Image
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: A135F-KSU-Next-SUSFS-AnyKernel3
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error
