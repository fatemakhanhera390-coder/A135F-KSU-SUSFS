name: A135F KSU-Next + SUSFS v8

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # ============================================================
  # A135F KERNEL
  # ============================================================
  KERNEL_REPO: https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_DEFCONFIG: exynos850-a13nsxx_defconfig
  KERNEL_VERSION_EXPECTED: 4.19.325

  # ============================================================
  # KERNELSU-NEXT
  # ============================================================
  KSU_REPO: https://github.com/SuleMareVientu/KernelSU-Next.git
  KSU_BRANCH: next-susfs-4.19

  # ============================================================
  # SUSFS
  # ============================================================
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_REF: 1.4.2-kernel-4.19

  # ============================================================
  # WORKING CLANG
  # ============================================================
  CLANG_URL: https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r450784e.tar.gz

  # ============================================================
  # MANUAL KSU NON-KPROBE HOOKS
  # ============================================================
  Jujutsu_HOOK_URL: https://raw.githubusercontent.com/Iam-nishan/Jujutsu-kernel/V6/syscall_hook.sh

jobs:

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ========================================================
      # 1. HOST DEPENDENCIES
      # ========================================================
      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ========================================================
      # 2. FETCH CORRECT A135F KERNEL
      # ========================================================
      - name: Checkout A135F kernel
        uses: actions/checkout@v4
        with:
          repository: Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      # ========================================================
      # 3. VERIFY SOURCE TREE
      # ========================================================
      - name: Verify A135F kernel source
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "A135F KERNEL SOURCE"
          echo "=========================================="

          git log -1 --oneline

          echo
          echo "Kernel version:"
          make kernelversion

          test "$(make kernelversion)" = "$KERNEL_VERSION_EXPECTED"

          echo
          echo "Checking requested defconfig..."

          if test ! -f \
            "arch/arm64/configs/$KERNEL_DEFCONFIG"; then

            echo
            echo "Requested defconfig not found:"
            echo "$KERNEL_DEFCONFIG"

            echo
            echo "Available A13/Exynos850 defconfigs:"
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              | grep -Ei 'a13|exynos850|a135' \
              | sort || true

            exit 1
          fi

          echo
          echo "Kernel source verification: PASS"

      # ========================================================
      # 4. CLANG
      # ========================================================
      - name: Install Clang toolchain
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$RUNNER_TEMP/toolchain"

          curl -L \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            "$CLANG_URL" \
            -o "$RUNNER_TEMP/clang.tar.gz"

          tar -xf \
            "$RUNNER_TEMP/clang.tar.gz" \
            -C "$RUNNER_TEMP/toolchain"

          CLANG_BIN="$(
            find "$RUNNER_TEMP/toolchain" \
              -type f \
              -name clang \
              -perm -111 \
              | head -n 1
          )"

          test -n "$CLANG_BIN"

          TOOLCHAIN_DIR="$(dirname "$CLANG_BIN")"

          test -x "$TOOLCHAIN_DIR/clang"
          test -x "$TOOLCHAIN_DIR/ld.lld"

          echo "CLANG_BIN=$TOOLCHAIN_DIR/clang" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN_DIR" >> "$GITHUB_PATH"

          echo
          echo "Clang:"
          "$TOOLCHAIN_DIR/clang" --version

          echo
          echo "LLD:"
          "$TOOLCHAIN_DIR/ld.lld" --version

      # ========================================================
      # 5. INITIAL DEFCONFIG
      # ========================================================
      - name: Configure baseline kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          make \
            O=out \
            ARCH=arm64 \
            "$KERNEL_DEFCONFIG"

          test -f out/.config

          echo "Baseline defconfig: PASS"

      # ========================================================
      # 6. CLONE KERNELSU-NEXT SOURCE
      # ========================================================
      - name: Fetch KernelSU-Next
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf KernelSU-Next

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$KSU_BRANCH" \
            "$KSU_REPO" \
            KernelSU-Next

          test -f KernelSU-Next/kernel/setup.sh
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile

          echo "KernelSU-Next source: PASS"

      # ========================================================
      # 7. INSTALL KSU LEGACY DRIVER
      # ========================================================
      - name: Install KernelSU-Next legacy driver
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "Current kernel root:"
          pwd

          test -d drivers
          test -f Makefile

          # Official KernelSU-Next setup script.
          # IMPORTANT:
          # Run it from the KERNEL SOURCE ROOT, not inside
          # the KernelSU-Next repository.
          curl -L \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh

          test -s /tmp/ksu-setup.sh

          chmod +x /tmp/ksu-setup.sh

          /tmp/ksu-setup.sh legacy

          echo
          echo "===== VERIFY KERNELSU DRIVER ====="

          test -d drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          test -f drivers/kernelsu/ksu.c

          echo
          echo "KernelSU-Next legacy driver: PASS"

      # ========================================================
      # 8. DOWNLOAD SUSFS 1.4.2
      # ========================================================
      - name: Fetch SUSFS 1.4.2 kernel-4.19
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf susfs4ksu

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$SUSFS_REF" \
            "$SUSFS_REPO" \
            susfs4ksu

          echo
          echo "SUSFS commit:"
          git -C susfs4ksu log -1 --oneline

          test -f \
            susfs4ksu/kernel_patches/fs/susfs.c

          test -f \
            susfs4ksu/kernel_patches/fs/sus_su.c

          test -f \
            susfs4ksu/kernel_patches/include/linux/susfs.h

          test -f \
            susfs4ksu/kernel_patches/include/linux/sus_su.h

          test -f \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          echo
          echo "SUSFS source verification: PASS"

      # ========================================================
      # 9. INSTALL SUSFS KERNEL SOURCES
      # ========================================================
      - name: Install SUSFS kernel sources
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          cp -fv \
            susfs4ksu/kernel_patches/fs/susfs.c \
            fs/susfs.c

          cp -fv \
            susfs4ksu/kernel_patches/fs/sus_su.c \
            fs/sus_su.c

          cp -fv \
            susfs4ksu/kernel_patches/include/linux/susfs.h \
            include/linux/susfs.h

          cp -fv \
            susfs4ksu/kernel_patches/include/linux/sus_su.h \
            include/linux/sus_su.h

          test -f fs/susfs.c
          test -f fs/sus_su.c
          test -f include/linux/susfs.h
          test -f include/linux/sus_su.h

          echo "SUSFS kernel sources installed."

      # ========================================================
      # 10. VERIFY / ENABLE KSU-SUSFS IN KERNELSU
      #
      # If next-susfs-4.19 already contains KSU_SUSFS:
      # do nothing.
      #
      # If not, apply official SUSFS KSU patch.
      # ========================================================
      - name: Integrate SUSFS with KernelSU
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          KSU_KCONFIG="drivers/kernelsu/Kconfig"

          test -f "$KSU_KCONFIG"

          if grep -qE \
            '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' \
            "$KSU_KCONFIG"; then

            echo "KernelSU tree already contains KSU_SUSFS."

          else

            echo "KSU_SUSFS not found."
            echo "Applying SUSFS KernelSU compatibility patch..."

            cp -fv \
              susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
              KernelSU-Next/10_enable_susfs_for_ksu.patch

            test -f \
              KernelSU-Next/10_enable_susfs_for_ksu.patch

            cd KernelSU-Next

            rm -f \
              ./*.rej \
              ./*.orig

            patch \
              --batch \
              --forward \
              -F3 \
              -p1 \
              < 10_enable_susfs_for_ksu.patch

            if find . \
              -type f \
              -name '*.rej' \
              | grep -q .; then

              echo
              echo "ERROR: SUSFS KernelSU patch rejected."

              find . \
                -type f \
                -name '*.rej' \
                -exec sh -c '
                  echo "===== $1 ====="
                  cat "$1"
                ' _ {} \;

              exit 1
            fi

            cd ..

            test -f \
              "$KSU_KCONFIG"

            grep -qE \
              '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' \
              "$KSU_KCONFIG"
          fi

          echo
          echo "KSU + SUSFS KernelSU integration: PASS"

      # ========================================================
      # 11. APPLY SUSFS MAIN KERNEL PATCH
      # ========================================================
      - name: Apply SUSFS 4.19 patch
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          PATCH_FILE="susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"

          find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            -delete

          patch \
            --batch \
            --forward \
            -F3 \
            -p1 \
            < "$PATCH_FILE" || true

          echo
          echo "Reject files after donor patch:"

          find . \
            -type f \
            -name '*.rej' \
            -print || true

      # ========================================================
      # 12. SMART NAMESPACE ADAPTATION
      #
      # Uses actual additions from the SUSFS donor patch.
      # No hand-written replacement logic.
      # ========================================================
      - name: Smart namespace adaptation
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          PATCH = Path(
              "susfs4ksu/kernel_patches/"
              "50_add_susfs_in_kernel-4.19.patch"
          )

          TARGET = Path("fs/namespace.c")

          patch_text = PATCH.read_text()
          target_text = TARGET.read_text()

          # ----------------------------------------------------
          # Extract fs/namespace.c section
          # ----------------------------------------------------
          m = re.search(
              r'(?ms)^diff --git a/fs/namespace\.c b/fs/namespace\.c\n'
              r'(.*?)(?=^diff --git |\Z)',
              patch_text
          )

          if not m:
              raise SystemExit(
                  "Could not locate fs/namespace.c "
                  "in SUSFS donor patch."
              )

          namespace_patch = m.group(1)

          # ----------------------------------------------------
          # Parse unified diff hunks
          # ----------------------------------------------------
          hunk_re = re.compile(
              r'(?ms)^@@ .*? @@([^\n]*)\n'
              r'(.*?)(?=^@@ |\Z)'
          )

          hunks = []

          for hm in hunk_re.finditer(namespace_patch):
              ctx = hm.group(1).strip()
              body = hm.group(2)

              lines = body.splitlines()

              added = [
                  x[1:]
                  for x in lines
                  if x.startswith("+") and not x.startswith("+++")
              ]

              hunks.append({
                  "context": ctx,
                  "body": lines,
                  "added": added,
              })

          print("Found namespace hunks:", len(hunks))

          # ----------------------------------------------------
          # Function finder
          # ----------------------------------------------------
          def function_range(src, name):
              mm = re.search(
                  r'\b' + re.escape(name) +
                  r'\s*\([^;{}]*\)\s*\{',
                  src
              )

              if not mm:
                  raise RuntimeError(
                      f"Function not found: {name}"
                  )

              brace = src.find("{", mm.start())

              depth = 0
              i = brace

              while i < len(src):
                  if src[i] == "{":
                      depth += 1
                  elif src[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return mm.start(), i + 1
                  i += 1

              raise RuntimeError(
                  f"Unbalanced braces: {name}"
              )

          def find_hunk(*terms):
              candidates = []

              for h in hunks:
                  blob = "\n".join(
                      [h["context"]] +
                      h["body"]
                  )

                  if all(term in blob for term in terms):
                      candidates.append(h)

              if len(candidates) != 1:
                  raise RuntimeError(
                      "Expected exactly one donor hunk for "
                      + repr(terms)
                      + ", found "
                      + str(len(candidates))
                  )

              return candidates[0]

          # ----------------------------------------------------
          # Exact donor additions for alloc call wrapper
          # ----------------------------------------------------
          vfs_alloc_hunk = find_hunk(
              "vfs_kern_mount",
              "alloc_vfsmnt(name, true, 0)"
          )

          clone_alloc_hunk = find_hunk(
              "clone_mnt",
              "alloc_vfsmnt(old->mnt_devname, true, 0)"
          )

          vfs_zygote_hunk = find_hunk(
              "vfs_kern_mount",
              "susfs_last_fake_mnt_id"
          )

          clone_zygote_hunk = find_hunk(
              "clone_mnt",
              "CL_ZYGOTE_COPY_MNT_NS"
          )

          # ----------------------------------------------------
          # Insert donor-added wrapper around original alloc line
          # ----------------------------------------------------
          def wrap_alloc(src, func, donor_hunk, original_call):
              start, end = function_range(src, func)

              fn = src[start:end]

              if "CONFIG_KSU_SUSFS_SUS_MOUNT" in fn and \
                 "alloc_vfsmnt(" in fn and \
                 (
                   "alloc_vfsmnt(name, true, 0)" in fn
                   or
                   "alloc_vfsmnt(old->mnt_devname, true, 0)" in fn
                 ):
                  print(
                      func,
                      "allocation block already integrated."
                  )
                  return src

              idx = fn.find(original_call)

              if idx < 0:
                  raise RuntimeError(
                      f"Original allocation call not found in {func}"
                  )

              added = donor_hunk["added"]

              if "#else" not in added:
                  raise RuntimeError(
                      f"Unexpected donor hunk for {func}: "
                      "missing #else"
                  )

              if "#endif" not in added:
                  raise RuntimeError(
                      f"Unexpected donor hunk for {func}: "
                      "missing #endif"
                  )

              # Keep donor indentation exactly as supplied.
              replacement = []

              inserted_original = False

              for line in added:
                  if line.strip() == "#else" and not inserted_original:
                      replacement.append(line)
                      replacement.append(original_call)
                      inserted_original = True
                  else:
                      replacement.append(line)

              if not inserted_original:
                  raise RuntimeError(
                      f"Could not insert original call in {func}"
                  )

              new_fn = (
                  fn[:idx]
                  + "\n".join(replacement)
                  + fn[idx + len(original_call):]
              )

              return (
                  src[:start]
                  + new_fn
                  + src[end:]
              )

          # ----------------------------------------------------
          # Exact zygote ID block
          # ----------------------------------------------------
          def add_zygote_block(
              src,
              func,
              donor_hunk
          ):
              start, end = function_range(src, func)
              fn = src[start:end]

              marker = "susfs_last_fake_mnt_id"

              if marker in fn:
                  print(
                      func,
                      "zygote mnt-id block already integrated."
                  )
                  return src

              parent = "mnt->mnt_parent = mnt;"

              pos = fn.find(parent)

              if pos < 0:
                  raise RuntimeError(
                      f"{parent} not found in {func}"
                  )

              lock_pos = fn.find(
                  "lock_mount_hash();",
                  pos
              )

              if lock_pos < 0:
                  raise RuntimeError(
                      f"lock_mount_hash() not found after "
                      f"{parent} in {func}"
                  )

              added = donor_hunk["added"]

              # The donor hunk contains the exact SUSFS block.
              block = "\n".join(
                  line
                  for line in added
                  if line.strip()
              )

              if not block:
                  raise RuntimeError(
                      f"Empty donor zygote block for {func}"
                  )

              new_fn = (
                  fn[:lock_pos]
                  + block
                  + "\n"
                  + fn[lock_pos:]
              )

              return (
                  src[:start]
                  + new_fn
                  + src[end:]
              )

          # ----------------------------------------------------
          # Handle the two known Samsung namespace callsite
          # mismatches.
          # ----------------------------------------------------
          target_text = wrap_alloc(
              target_text,
              "vfs_kern_mount",
              vfs_alloc_hunk,
              "mnt = alloc_vfsmnt(name);"
          )

          target_text = wrap_alloc(
              target_text,
              "clone_mnt",
              clone_alloc_hunk,
              "mnt = alloc_vfsmnt(old->mnt_devname);"
          )

          target_text = add_zygote_block(
              target_text,
              "vfs_kern_mount",
              vfs_zygote_hunk
          )

          target_text = add_zygote_block(
              target_text,
              "clone_mnt",
              clone_zygote_hunk
          )

          TARGET.write_text(target_text)

          # ----------------------------------------------------
          # Verify structural pieces.
          # ----------------------------------------------------
          final_text = TARGET.read_text()

          checks = [
              "static struct mount *alloc_vfsmnt(",
              "alloc_vfsmnt(name, true, 0)",
              "alloc_vfsmnt(name, false, 0)",
              "alloc_vfsmnt(old->mnt_devname, true, 0)",
              "alloc_vfsmnt(old->mnt_devname, false, 0)",
              "susfs_is_current_ksu_domain",
              "susfs_is_current_zygote_domain",
              "susfs_last_fake_mnt_id",
              "CL_ZYGOTE_COPY_MNT_NS",
          ]

          for item in checks:
              if item not in final_text:
                  raise SystemExit(
                      "Missing namespace integration marker: "
                      + item
                  )

          print()
          print(
              "Smart SUSFS namespace adaptation: PASS"
          )

          PY

      # ========================================================
      # 13. RESOLVE REJECTS
      # ========================================================
      - name: Validate SUSFS patch state
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          # Namespace reject was handled structurally above.
          rm -f fs/namespace.c.rej
          rm -f fs/namespace.c.orig

          echo
          echo "Remaining reject files:"

          REJECTS="$(
            find . \
              -type f \
              -name '*.rej' \
              -print
          )"

          if test -n "$REJECTS"; then

            echo
            echo "ERROR: unresolved SUSFS rejects remain."

            echo "$REJECTS"

            echo
            echo "===== reject contents ====="

            find . \
              -type f \
              -name '*.rej' \
              -exec sh -c '
                echo "===== $1 ====="
                cat "$1"
              ' _ {} \;

            exit 1
          fi

          echo "No unresolved patch rejects."

      # ========================================================
      # 14. VERIFY NAMESPACE
      # ========================================================
      - name: Verify SUSFS namespace
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== vfs_kern_mount() ====="

          sed -n \
            '/vfs_kern_mount(/,/^}/p' \
            fs/namespace.c \
            | grep -E \
              'CONFIG_KSU_SUSFS_SUS_MOUNT|alloc_vfsmnt|susfs_is_current|susfs_last_fake'

          echo
          echo "===== clone_mnt() ====="

          sed -n \
            '/clone_mnt(/,/^}/p' \
            fs/namespace.c \
            | grep -E \
              'CONFIG_KSU_SUSFS_SUS_MOUNT|alloc_vfsmnt|is_current_ksu_domain|is_current_zygote_domain|CL_COPY_MNT_NS|CL_ZYGOTE_COPY_MNT_NS'

          echo
          echo "Namespace verification: PASS"

      # ========================================================
      # 15. MANUAL KSU NON-KPROBE HOOKS
      # ========================================================
      - name: Apply KernelSU manual hooks
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          # If these hooks are already present, do not run the
          # script twice.
          if \
            grep -q 'ksu_handle_execveat' fs/exec.c && \
            grep -q 'ksu_handle_faccessat' fs/open.c && \
            grep -q 'ksu_handle_sys_read' fs/read_write.c && \
            grep -q 'ksu_handle_stat' fs/stat.c && \
            grep -q 'ksu_handle_sys_reboot' kernel/reboot.c
          then
            echo "Manual KSU hooks already present."
          else

            curl -L \
              --retry 8 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 300 \
              "$Jujutsu_HOOK_URL" \
              -o /tmp/syscall_hook.sh

            test -s /tmp/syscall_hook.sh

            chmod +x /tmp/syscall_hook.sh

            bash /tmp/syscall_hook.sh
          fi

          echo
          echo "Verifying manual KSU hooks..."

          grep -q \
            'ksu_handle_execveat' \
            fs/exec.c

          grep -q \
            'ksu_handle_faccessat' \
            fs/open.c

          grep -q \
            'ksu_handle_sys_read' \
            fs/read_write.c

          grep -q \
            'ksu_handle_stat' \
            fs/stat.c

          grep -q \
            'ksu_handle_sys_reboot' \
            kernel/reboot.c

          echo
          echo "Manual KSU hooks: PASS"

      # ========================================================
      # 16. CONFIGURE KSU + SUSFS
      # ========================================================
      - name: Configure KernelSU and SUSFS
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          CONFIG="out/.config"

          test -f "$CONFIG"

          # ----------------------------------------------------
          # Mandatory
          # ----------------------------------------------------
          scripts/config \
            --file "$CONFIG" \
            --enable CONFIG_KSU

          scripts/config \
            --file "$CONFIG" \
            --enable CONFIG_KSU_SUSFS

          # ----------------------------------------------------
          # SUSFS optional features
          #
          # Only enable if the symbol exists in this tree.
          # ----------------------------------------------------
          for SYMBOL in \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          do
            if grep -Rqs \
              "^config ${SYMBOL#CONFIG_}[[:space:]]*$" \
              drivers/kernelsu \
              KernelSU-Next/kernel 2>/dev/null
            then
              echo "Enable $SYMBOL"
              scripts/config \
                --file "$CONFIG" \
                --enable "$SYMBOL"
            else
              echo "Optional symbol not present: $SYMBOL"
            fi
          done

          # ----------------------------------------------------
          # Manual KSU hooks => no KPROBE mode
          # ----------------------------------------------------
          for SYMBOL in \
            CONFIG_KSU_KPROBE_HOOKS \
            CONFIG_KPROBE_EVENTS \
            CONFIG_KPROBES
          do
            if grep -Rqs \
              "^config ${SYMBOL#CONFIG_}[[:space:]]*$" \
              drivers \
              kernel \
              2>/dev/null
            then
              scripts/config \
                --file "$CONFIG" \
                --disable "$SYMBOL"
            fi
          done

          # ----------------------------------------------------
          # SUS_SU must be disabled with manual non-kprobe hooks.
          # ----------------------------------------------------
          if grep -Rqs \
            '^config KSU_SUSFS_SUS_SU[[:space:]]*$' \
            drivers/kernelsu \
            KernelSU-Next/kernel 2>/dev/null
          then
            scripts/config \
              --file "$CONFIG" \
              --disable CONFIG_KSU_SUSFS_SUS_SU
          fi

          # ----------------------------------------------------
          # Re-resolve dependencies.
          # ----------------------------------------------------
          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "===== KSU/SUSFS CONFIG ====="

          grep -E \
            '^CONFIG_KSU' \
            "$CONFIG" \
            | sort || true

          echo
          echo "===== KPROBE CONFIG ====="

          grep -E \
            '^CONFIG_(KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS)' \
            "$CONFIG" \
            | sort || true

          grep -q '^CONFIG_KSU=y$' \
            "$CONFIG"

          grep -q '^CONFIG_KSU_SUSFS=y$' \
            "$CONFIG"

          echo
          echo "Configuration verification: PASS"

      # ========================================================
      # 17. FINAL SOURCE CHECK
      # ========================================================
      - name: Final source integrity check
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          test -f fs/susfs.c
          test -f fs/sus_su.c
          test -f include/linux/susfs.h
          test -f include/linux/sus_su.h

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          grep -Rqs \
            'susfs_is_current_ksu_domain' \
            fs/namespace.c

          grep -Rqs \
            'susfs_is_current_zygote_domain' \
            fs/namespace.c

          grep -Rqs \
            'ksu_handle_execveat' \
            fs/exec.c

          grep -Rqs \
            'ksu_handle_sys_reboot' \
            kernel/reboot.c

          echo "Final source integrity: PASS"

      # ========================================================
      # 18. BUILD KERNEL
      # ========================================================
      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export CC="$TOOLCHAIN_DIR/clang"
          export LD="$TOOLCHAIN_DIR/ld.lld"
          export AR="$TOOLCHAIN_DIR/llvm-ar"
          export NM="$TOOLCHAIN_DIR/llvm-nm"
          export OBJCOPY="$TOOLCHAIN_DIR/llvm-objcopy"
          export OBJDUMP="$TOOLCHAIN_DIR/llvm-objdump"
          export STRIP="$TOOLCHAIN_DIR/llvm-strip"

          export HOSTCC="$TOOLCHAIN_DIR/clang"
          export HOSTCXX="$TOOLCHAIN_DIR/clang++"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            STRIP="$STRIP" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            -j"$(nproc)"

      # ========================================================
      # 19. VERIFY BUILD OUTPUT
      # ========================================================
      - name: Verify kernel output
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "===== ARM64 BOOT OUTPUTS ====="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          test -f \
            out/arch/arm64/boot/Image

          if test -f \
            out/arch/arm64/boot/Image.gz; then

            echo
            echo "Image.gz found."

            cp \
              out/arch/arm64/boot/Image.gz \
              ../A135F-KSU-SUSFS-Image.gz

          else
            echo
            echo "Image.gz not produced."
            exit 1
          fi

          cp \
            out/.config \
            ../A135F-KSU-SUSFS-config

          echo
          echo "Kernel build output: PASS"

      # ========================================================
      # 20. STATIC FINAL VERIFICATION
      # ========================================================
      - name: Verify final kernel integration
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "===== CONFIG ====="

          grep -E \
            '^CONFIG_KSU' \
            out/.config \
            | sort

          echo
          echo "===== SUSFS SOURCE ====="

          grep -R \
            -n \
            'susfs_is_current_ksu_domain\|susfs_is_current_zygote_domain' \
            fs/namespace.c \
            | head -20

          echo
          echo "===== KSU HOOKS ====="

          grep -R \
            -n \
            'ksu_handle_' \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            fs/stat.c \
            kernel/reboot.c \
            | head -100

          echo
          echo "===== BUILD IMAGE ====="

          ls -lh \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz

          echo
          echo "FINAL KERNEL VERIFICATION: PASS"

      # ========================================================
      # 21. DIAGNOSTICS
      # ========================================================
      - name: Collect diagnostics
        if: always()
        working-directory: kernel
        shell: bash
        run: |
          set +e

          mkdir -p ../diagnostics

          git status --short \
            > ../diagnostics/git-status.txt

          git log -1 --oneline \
            > ../diagnostics/kernel-commit.txt

          make kernelversion \
            > ../diagnostics/kernel-version.txt

          if test -f out/.config; then
            cp \
              out/.config \
              ../diagnostics/final-config.txt

            grep -E \
              '^CONFIG_KSU' \
              out/.config \
              > ../diagnostics/ksu-config.txt
          fi

          grep -n \
            'CONFIG_KSU_SUSFS_SUS_MOUNT\|susfs_is_current_ksu_domain\|susfs_is_current_zygote_domain\|susfs_last_fake_mnt_id' \
            fs/namespace.c \
            > ../diagnostics/namespace-susfs.txt

          find . \
            -type f \
            -name '*.rej' \
            -print \
            > ../diagnostics/reject-files.txt

          find . \
            -type f \
            -name '*.rej' \
            -exec sh -c '
              echo "===== $1 ====="
              cat "$1"
            ' _ {} \; \
            > ../diagnostics/reject-contents.txt

          cp \
            fs/namespace.c \
            ../diagnostics/namespace.c

          cp \
            fs/namespace.c \
            ../diagnostics/namespace-final.c

      # ========================================================
      # 22. UPLOAD ARTIFACTS
      # ========================================================
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A135F-KSU-SUSFS-v8
          if-no-files-found: warn
          path: |
            A135F-KSU-SUSFS-Image.gz
            A135F-KSU-SUSFS-config
            diagnostics/
